name: Notify on Push to Main

on:
  push:
    branches: [main]

# LOAD-BEARING. Without this block the job runs with the repository's default
# GITHUB_TOKEN scopes, which are read-only, and `issues.create` fails 403
# "Resource not accessible by integration". This workflow was the only one in
# .github/workflows/ with no permissions: block, and it had failed on every
# push to main since at least 2026-06-16 — 50 runs, zero notifications ever
# delivered. The two other workflows that open issues (evals-monitor.yml,
# triage-weekly.yml) both declare issues: write; this one just never did.
permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify owners of push to main
        uses: actions/github-script@v7
        with:
          script: |
            const pusher = context.actor;
            const sha = context.sha.substring(0, 7);
            const commitMsg = context.payload.head_commit?.message || 'No message';
            const compareUrl = context.payload.compare || '';

            // Don't create noisy issues for tag pushes or empty pushes
            if (!context.payload.head_commit) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Push to main by ${pusher}: ${commitMsg.split('\n')[0].substring(0, 60)}`,
              body: [
                `**Pushed by:** @${pusher}`,
                `**Commit:** \`${sha}\``,
                `**Message:** ${commitMsg}`,
                compareUrl ? `**Compare:** ${compareUrl}` : '',
                '',
                'cc @mayur294-lgtm @shobhitonnet'
              ].filter(Boolean).join('\n'),
              labels: ['push-notification']
            });
