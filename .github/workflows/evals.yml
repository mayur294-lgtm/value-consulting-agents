name: Evals (harness gate)

# Tier-1 component-change gate. Runs the eval suite on any PR that touches a
# content component (agent / command / skill / template / presentation / hook
# / pipeline). BLOCKING mode (SHADOW: "false") since 2026-07-24: the job exits
# non-zero when a gated eval fails. To fully enforce, this check must also be
# marked "Required" in branch protection on main (repo admin). Set SHADOW:
# "true" to revert to advisory.

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".claude/hooks/**"
      - ".claude/settings.json"       # hook REGISTRATION — changes hook behaviour with no hook file touched (#191)
      - "templates/**"
      - "presentations/**"
      - "scripts/**.py"
      - "scripts/**.sh"               # setup_pii.sh, init_engagement.sh, _resolve_python.sh's callers — the .py-only filter skipped every shell script under scripts/
      - "tools/**.py"                 # roi_excel_generator.py and friends — was missing from this filter (#193)
      - "evals/**"
      # THE GATE GATES ITSELF. Without this line a PR that only WEAKENS this
      # workflow — flipping SHADOW to "true", deleting the derive step,
      # narrowing the filter above — never runs it, and merges unopposed.
      # That is #191's own argument (hook REGISTRATION changes behaviour with
      # no hook file touched) applied to the registration of this gate.
      - ".github/workflows/evals.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      SHADOW: "false"                      # BLOCKING since 2026-07-24 — goldens re-pointed to committed fixtures (PR #92), gate is now trustworthy
      # Provide these as repo secrets to enable Langfuse logging + LLM-judge:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            evals/requirements.txt
            requirements.txt
      - name: Install deps
        run: |
          pip install -r evals/requirements.txt
          if [ -n "$LANGFUSE_PUBLIC_KEY" ]; then pip install "langfuse>=2.0" "anthropic>=0.40"; fi
      - name: Install PII deps (pii-anonymizer component)
        # scripts/pii/engine.py imports presidio_analyzer at module level and
        # needs Python 3.10-3.13 (see its module docstring) — actions/setup-python
        # above already pins 3.11, so `sys.executable` here is Presidio-capable
        # and the pii-anonymizer rubric can import the engine in-process with no
        # separate venv step. requirements.txt carries the Presidio/spaCy pins,
        # including the ~380 MB en_core_web_lg model as a pinned direct wheel
        # URL dependency — this single install pulls the same model everywhere
        # (see requirements.txt / scripts/setup_pii.sh), no separate download
        # step needed. The setup-python cache above keys on this file so the
        # wheel isn't re-fetched every run.
        run: |
          pip install -r requirements.txt
      - name: Registry preflight
        # Fail fast if any GATING golden can't resolve in CI (missing or
        # gitignored) — a silently-skipped golden would make its gate a
        # vacuous PASS. Bare-name engagement goldens are reported as
        # non-fatal DEBT. Runs before the suite so a mis-wired registry is a
        # precise error, not a green-that-verified-nothing.
        run: python evals/check_registry.py
      - name: Derive changed components
        # #193: a component-scoped change (an agent, a hook with its own
        # row, a generator script) must run ITS row, and a changed file that
        # maps to a component with no row must fail loudly — a silent skip
        # here is exactly the failure mode this epic exists to close. The
        # path->row table below is intentionally the ONLY place this mapping
        # lives (not duplicated into a helper script) so there is exactly one
        # file to keep in sync when a component's subject file moves; every
        # entry mirrors a path evals/registry.yaml's own comments already
        # name for that row. It reads registry.yaml fresh every run, so it
        # can never drift on the "does this row still exist" half of the
        # question — only the "which path maps to which row" half is
        # hand-maintained, and that half fails CLOSED (hard error), not open.
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --name-only > /tmp/changed_paths.txt
          python3 - <<'PY'
          import os
          import re
          import sys

          import yaml

          reg = yaml.safe_load(open("evals/registry.yaml"))
          components = set((reg.get("components") or {}).keys())

          # Explicit path -> component for rows whose subject file does NOT
          # follow the `.claude/agents/<name>.md` == component-name
          # convention handled below. Keep in sync by hand; every target here
          # is named in the matching row's comment in evals/registry.yaml.
          EXPLICIT = {
              "tools/roi_excel_generator.py": "roi-excel-generator",
              ".claude/hooks/mcp-query-guard.py": "mcp-query-guard",
              ".claude/hooks/anonymize-guard.py": "pii-anonymizer",
              "scripts/anonymize_transcript.py": "pii-anonymizer",
              "evals/run_experiment.py": "run-experiment-runner",
              "evals/mutations.py": "mutation-harness",
              "evals/check_registry.py": "mutation-harness",
          }
          EXPLICIT_PREFIXES = {
              "scripts/pii/": "pii-anonymizer",
          }
          # Convention: an agent's own row is named after its file stem.
          # Excludes .claude/agents/deprecated/** — those are explicitly
          # retired (CLAUDE.md "Flywheel") and were never eval-adopted.
          AGENT_RE = re.compile(r"^\.claude/agents/([^/]+)\.md$")

          # Retired agents that still sit at the LIVE path as a redirect stub
          # rather than under deprecated/ — touching one would otherwise hard
          # fail CI demanding an eval row for an agent nobody may invoke.
          # Deliberately an explicit, greppable path list and NOT a
          # "description starts with DEPRECATED" frontmatter rule: a
          # frontmatter rule lets any PR dodge this gate by adding one word to
          # a description, which is the silent-skip failure mode this whole
          # epic exists to close. Extending this list requires editing this
          # workflow — which, per the `paths:` filter above, now runs the gate
          # on itself. The durable fix is deleting the live-path stub
          # (.claude/agents/deprecated/roi-business-case-builder.md already
          # holds the real copy); until then, this one line.
          RETIRED_IN_PLACE = {
              ".claude/agents/roi-business-case-builder.md",
          }

          paths = [line.strip() for line in open("/tmp/changed_paths.txt") if line.strip()]

          matched: set[str] = set()
          missing: list[tuple[str, str]] = []
          for p in paths:
              if p in RETIRED_IN_PLACE:
                  print(f"note: {p} is a retired-in-place agent stub — no eval row expected")
                  continue
              comp = EXPLICIT.get(p)
              if comp is None:
                  for prefix, name in EXPLICIT_PREFIXES.items():
                      if p.startswith(prefix):
                          comp = name
                          break
              if comp is None:
                  m = AGENT_RE.match(p)
                  if m and "/deprecated/" not in p:
                      comp = m.group(1)
              if comp is None:
                  # Not a path this mapping treats as a component: NOTHING in
                  # this job re-evaluates it. Do not read this as "covered by
                  # the fixed deliverable/altitude evals" — for the prompt
                  # tier that is false. `--deliverable deck|roi|assessment|
                  # report` and `--altitude deliverable-structural` all score
                  # COMMITTED GOLDEN FILES; they never re-render from a
                  # changed command, skill or template, so a change to one
                  # cannot move them. This is a known, filed inconsistency
                  # (.prd/backlog.md, "uncovered-path inconsistency"): 17 path
                  # classes trigger this workflow and then skip silently,
                  # while a changed agent with no row hard-fails four lines
                  # below. The intended direction is extending fail-loud to
                  # them, not softening the agent rule.
                  continue
              if comp in components:
                  matched.add(comp)
              else:
                  missing.append((p, comp))

          if missing:
              print("::error::changed file(s) map to a component with NO row in evals/registry.yaml — "
                    "add one (see CLAUDE.md's bb-* harness: a new/changed component needs eval "
                    "coverage) rather than let this skip silently:")
              for p, comp in missing:
                  print(f"::error::  {p}  ->  expected components.{comp} in evals/registry.yaml, but it is not there")
              sys.exit(1)

          names = sorted(matched)
          print("changed component rows to run:", names or "(none)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("components=" + " ".join(names) + "\n")
          PY
      - name: Run eval suite
        id: run
        env:
          CHANGED_COMPONENTS: ${{ steps.changed.outputs.components }}
        run: |
          set -o pipefail
          {
            echo '## Eval results'
            echo
            echo '```'
            rc=0

            # Fixed list — every PR in scope runs these regardless of what changed.
            fixed_cmds=(
              "--deliverable deck --negatives"
              "--deliverable roi"
              "--deliverable assessment"
              "--deliverable report"
              "--component mcp-query-guard"
              "--component pii-anonymizer"
              "--altitude deliverable-structural"
            )
            for cmd in "${fixed_cmds[@]}"; do
              echo "### run_experiment.py $cmd"
              python evals/run_experiment.py $cmd || rc=1
              echo
            done

            # Changed-component rows (#193) — anything the diff maps to that
            # isn't already covered by the fixed list above.
            declare -A already=( [mcp-query-guard]=1 [pii-anonymizer]=1 )
            for name in $CHANGED_COMPONENTS; do
              if [ -z "${already[$name]:-}" ]; then
                already[$name]=1
                echo "### run_experiment.py --component $name  (changed-component row, #193)"
                python evals/run_experiment.py --component "$name" || rc=1
                echo
              fi
            done

            # Mutation proofs (#193) — every row that DECLARES a mutations
            # entry gets its proof re-run in CI, not just locally. Derived
            # fresh from the registry every run (never a hardcoded row list,
            # which would silently stop covering a row the moment a new one
            # is added, or keep "covering" one that dropped its mutations:).
            mutate_rows=$(python3 - <<'PY'
          import yaml

          reg = yaml.safe_load(open("evals/registry.yaml"))
          rows = []
          for section in ("components", "deliverables"):
              for name, spec in (reg.get(section) or {}).items():
                  if isinstance(spec.get("mutations"), dict) or isinstance(spec.get("negatives"), dict):
                      rows.append(name)
          print(" ".join(sorted(rows)))
          PY
          )
            for row in $mutate_rows; do
              echo "### run_experiment.py --mutate $row  (mutation proof, #193)"
              python evals/run_experiment.py --mutate "$row" || rc=1
              echo
            done

            echo '```'
            echo
            if [ "$rc" -ne 0 ]; then
              echo "**Verdict: FAIL** — one or more rubrics below threshold."
            else
              echo "**Verdict: PASS**"
            fi
            echo "$rc" > /tmp/rc
          } | tee /tmp/eval_report.md
          echo "rc=$(cat /tmp/rc)" >> "$GITHUB_OUTPUT"
      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/eval_report.md', 'utf8');
            const marker = '<!-- cortex-evals -->';
            const { data: comments } = await github.rest.issues.listComments(
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const payload = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment(
                { owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment(
                { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: payload });
            }
      - name: Enforce gate
        if: always()
        run: |
          rc="${{ steps.run.outputs.rc }}"
          if [ "$SHADOW" = "true" ]; then
            echo "SHADOW mode — not blocking (rc=$rc). Flip SHADOW to false to enforce."
            exit 0
          fi
          exit "$rc"
