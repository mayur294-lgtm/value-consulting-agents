  # ===========================================================================
  # NO rubric_calibration ROWS HERE (#201, completed in the epic's closing pass)
  # ===========================================================================
  # #201 shipped a YAML alias block at this spot: the eleven `rubric_calibration:`
  # rows aliased back into `components:` so `--component <rubric>` / `--mutate
  # <rubric>` could reach them while `run_experiment.py` was owned by a concurrent
  # ticket (#204). #204 has landed, the runner now has a real `--calibration`
  # branch that reads the `rubric_calibration:` section directly, and the shim is
  # deleted.
  #
  # Do not put a calibration row back into this section, under either name. A row
  # that answers to `--component` is a component gate to every reader and every
  # quoted number, which is the exact misreading #201 exists to remove. The
  # boundary is asserted, not just described: `check_registry.py`'s
  # `check_rubric_calibration` fails preflight if a calibration row appears in
  # `components:`, and separately fails if the runner has no `--calibration`
  # dispatch (an unreachable row is a gate nobody can run, which reads as
  # "nothing failed"). The agent NAMES keep their hard-failing `retired:` redirect
  # rows below — those are signposts, never gates.

  # ===========================================================================
  # RETIRED AGENT-NAME ROWS (#201) — REDIRECT ONLY, never a gate
  # ===========================================================================
  # These eleven agent names used to key a gating row. They no longer do. Each
  # keeps a stub here for exactly two reasons:
  #
  #   1. `--component market-context-researcher` would otherwise die on a bare
  #      `KeyError` from `reg["components"][args.component]`, which teaches the
  #      reader nothing. `rubrics.component.moved_to_rubric_calibration` always
  #      HARD-FAILS and prints the agent -> calibration-row mapping plus the
  #      distinction, so the old name can never be green and can never be quoted
  #      as evidence about anything.
  #   2. `.github/workflows/evals.yml`'s derive step maps a changed
  #      `.claude/agents/<name>.md` to `components.<name>` and hard-errors when
  #      the row is missing. It reads the `retired:` flag below and SKIPS these
  #      rows with a notice rather than running them — because running a
  #      calibration rubric on a prompt change would tell the reviewer nothing
  #      about the prompt they changed, and CI must not imply otherwise.
  #
  # SHAPE IS ENFORCED (check_registry.py `check_retired_redirect_rows`): a
  # `retired: true` row must declare no `code:`, no `input:`, no `negatives:`,
  # this evaluator, and a `moved_to:` naming a real `rubric_calibration` row. A
  # redirect stub cannot quietly grow back into a gate.
  market-context-researcher:
    retired: true
    moved_to: market-context-rubric
    evaluator: rubrics.component.moved_to_rubric_calibration
    threshold: 1.00
