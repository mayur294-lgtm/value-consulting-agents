# Cortex eval registry — the per-component / per-deliverable spec.
# run_experiment.py is driven entirely by this file. Add a row to bring a new
# agent/skill/deliverable under the harness. Existing components are adopted
# lazily (the seam): give them a row the next time they're touched.
#
# threshold = minimum mean rubric score to PASS (hard-fail checks override).
# evaluator = importable module exposing evaluate(target) -> list[CheckResult].

deliverables:
  deck:
    altitude: deliverable
    evaluator: rubrics.deliverable.decks
    threshold: 0.85
    goldens:
      - evals/goldens/deck_valid_min.html        # on-palette calibration anchor (post PR #71)
    negatives:
      - evals/goldens/negatives/deck_offpalette.html
    # Real shipped decks — scored by evals-monitor.yml (Loop 3). Most predate the
    # PR #71 palette correction (2026-06-22) and are EXPECTED to surface drift.
    monitor:
      - engagements/test_inspire/2026-02_retail_ignite/outputs/strategy_workshop_deck.html

  # SLOT RULE (see deck above): `goldens:` / `negatives:` are small, frozen,
  # COMMITTED fixtures authored to test the rubric — they are what the PR gate
  # runs. `monitor:` is real shipped engagement output, watched for drift by
  # evals-monitor.yml and NEVER gating. Real `engagements/**` paths must never
  # appear under `goldens:` — that tree is gitignored (PII), so the file is
  # absent in every clean checkout and CI, and a missing golden is [SKIP]-ed,
  # which counts as a PASS. That made these three gates vacuously green.
  roi:
    altitude: deliverable
    evaluator: rubrics.deliverable.roi
    threshold: 0.80
    goldens:
      - evals/goldens/roi_report_valid.md        # synthetic (Meridian Mutual) — exercises the rubric
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v2/outputs/roi_report.md

  assessment:
    altitude: deliverable
    evaluator: rubrics.deliverable.assessment
    threshold: 0.80
    goldens:
      - evals/goldens/assessment_dashboard_valid.html   # synthetic — 7-act arc, on-palette
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v6/outputs/assessment_dashboard.html
      - engagements/nfis/2026-02_digital_investor_assessment_v2/outputs/assessment_dashboard.html

  report:
    altitude: deliverable
    evaluator: rubrics.deliverable.report
    threshold: 0.80
    goldens:
      - evals/goldens/assessment_report_valid.md        # synthetic — passes tone + assumption-discipline judges
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v6/outputs/assessment_report.md

# Component (unit) altitude — score an agent's direct output on a fixed input.
#
# Two declaration keys, two different contracts (#182, D5 — "declared means
# required"):
#   code:         GATES. Deterministic Python checks that
#                 `run_experiment.py --component <name>` actually executes on
#                 every run; `declared_checks_all_executed` asserts every name
#                 listed here produced a CheckResult, or the run fails naming it.
#   path1_judge:  Does NOT gate. Semantic LLM-as-judge checks that apply only
#                 when the component is regenerated via path-1
#                 (evals/path1.py --agent <name>, #204) — the component gate's
#                 thin adapters (rubrics/component/<name>.py) call only
#                 specifics._<fn> and never reach these, by design (a metered
#                 judge must never sit on a gating path — CI stays key-free).
# A row may still legitimately declare a gating `judge:` (none do post-migration,
# but the key remains meaningful) — if it does, that name is asserted executed
# too, exactly like `code:`.
#
# All `code` checks below are implemented in rubrics.component.specifics (which
# runs on top of the rubrics.component.governance baseline that every agent
# inherits); `path1_judge` checks are the semantic LLM rubrics in rubrics.judge.
components:
  market-context-researcher:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/market_context_golden.md   # scores specifics._market_context via rubrics.component.market_context_researcher
    code: [annual_report_attempted, module1_metrics_present, competitor_benchmark_section]   # incl. the documented miss
    path1_judge: [sources_credible_not_hallucinated]

  roi-financial-modeler:
    altitude: component
    # threshold raised 0.80 -> 0.90 (#180): backbase_impact_within_cap stays a
    # plain mean-contributor (no hard_fail — see D10, specifics.py frozen this
    # cycle). At 0.90 the overcap negative (scores 0.889, 8/9 checks) correctly
    # FAILS via ordinary mean scoring, while the positive golden (1.000) still
    # clears it comfortably. Per D3, a per-check hard_fail fix is deferred to #201.
    threshold: 0.90
    # Fixture: the committed anonymized provenance golden (the basis the provenance
    # fix was built on). Re-pointed from a never-created `nfis` golden — see PRD v1.
    input: evals/goldens/roi_config_provenance.json
    negatives:
      - evals/goldens/roi_config_overcap.json
    code: [three_scenarios, npv_payback_present, assumptions_register_present, sensitivity_analysis_present,
           basic_information_has_sources_list, basic_fields_have_source_and_confidence, operating_costs_emitted_as_formula,
           backbase_impact_within_cap, overcap_negative_gate_witness]
    path1_judge: [conservative_bias, topdown_bottomup_correlation]
    # #104 parity case (standalone /build-roi + /generate-roi-excel now run the
    # same artifact_boundary.py cap_roi_config gate the pipeline runs, #102):
    #   - goldens: roi_config_provenance.json above (the wired `input:`) is
    #     already capped — `backbase_impact_within_cap` must PASS on it.
    #   - negatives: evals/goldens/roi_config_overcap.json — a >0.60 backbase_impact
    #     (driver-level + scenario-level) with scenario numbers that push the
    #     curve-adjusted 5-yr ROI (279%) outside the Retail Banking benchmark
    #     (100-150%). As of #180, `components:` altitude DOES wire a `negatives:`
    #     list the same way `deliverables:` does (see run_experiment.py) — `--negatives`
    #     runs this fixture through the same evaluator with expect_pass=False, so
    #     the gate only passes if `backbase_impact_within_cap` (hard_fail, see
    #     rubrics/component/specifics.py) correctly fails on it. The
    #     `overcap_negative_gate_witness` check below predates #180 and is kept as
    #     an additional, self-contained witness: it loads this same fixture directly
    #     and proves it FAILS `backbase_impact_within_cap` pre-gate, then gates a
    #     /tmp COPY of it (scripts/artifact_boundary.py cap_roi_config — never
    #     mutates the committed fixture) and proves the capped copy PASSES the
    #     same invariant.

  # roi-excel-generator (#85) — verifies the GENERATOR actually renders the
  # provenance contract the roi-financial-modeler agent emits (#83 generator,
  # #84 agent contract): Sources sheet, explicit confidence wins over the
  # keyword heuristic, Operating Costs as a live formula, derived driver
  # formulas. Deterministic code checks only — no judge this cycle.
  # Two self-contained goldens (no engagement-output path resolution at
  # runtime): one WITH the full provenance contract, one WITHOUT it (the
  # backward-compat witness — must still generate clean with no Sources sheet).
  roi-excel-generator:
    altitude: component
    threshold: 0.80
    input: evals/goldens/roi_config_provenance.json
    code: [sources_sheet_present, sources_sheet_absent_when_unset, no_confidence_row_leak,
           explicit_confidence_wins, operating_costs_is_formula, derived_input_formula_renders]

  roi-hypothesis-builder:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/roi_hypothesis_golden.md   # scores specifics._roi_hypothesis via rubrics.component.roi_hypothesis_builder
    code: [lever_ids_present, four_link_chain_present, problem_statement_present]
    path1_judge: [levers_grounded_in_evidence]

  discovery-transcript-interpreter:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/discovery_evidence_register_golden.md   # scores specifics._discovery via rubrics.component.discovery_transcript_interpreter
    code: [evidence_ids_wellformed, evidence_register_present, lifecycle_tags_present, pain_points_present]
    path1_judge: [faithful_extraction_no_invention]

  capability-assessment:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/capability_assessment_golden.md   # scores specifics._capability via rubrics.component.capability_assessment
    code: [maturity_scale_0_4, executive_summary_present, front_middle_back_layers, unconsidered_needs_present, scores_have_evidence_refs]
    path1_judge: [scores_justified_by_evidence]

  roadmap-prioritization:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/roadmap_golden.md   # scores specifics._roadmap via rubrics.component.roadmap_prioritization
    code: [phases_present, initiatives_sequenced, dependencies_present, gates_or_milestones_present]
    path1_judge: [initiatives_traced_to_gaps_and_levers]

  narrative-assembler:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/narrative_golden.md   # scores specifics._narrative via rubrics.component.narrative_assembler
    code: [seven_acts_present, executive_summary_present, transformation_arc_present]
    path1_judge: [transformation_arc_threaded_7_acts]   # the documented assembler weakness

  journey-builder:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/journey_maps_golden.md   # scores specifics._journey via rubrics.component.journey_builder
    code: [lifecycle_stages_present, friction_or_leakage_present, as_is_and_future_state]
    path1_judge: [value_leakage_quantified]

  benchmark-librarian:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/benchmark_golden.md   # scores specifics._benchmark via rubrics.component.benchmark_librarian
    code: [confidence_levels_present, source_attribution_present, no_synthetic_citations]
    path1_judge: [benchmarks_defensible_not_hallucinated]

  usecase-designer:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/usecase_golden.md   # scores specifics._usecase via rubrics.component.usecase_designer
    code: [usecase_ids_present, product_directory_mapping, ootb_config_custom_classification, priority_tiers_present]
    path1_judge: [usecases_grounded_in_product_directory]

  workshop-preparation:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/workshop_prep_golden.md   # scores specifics._workshop_prep via rubrics.component.workshop_preparation
    code: [hypotheses_present, validation_questions_present, checkpoint_present]
    path1_judge: [hypotheses_specific_and_quantified]

  # knowledge-harvester (#130) — pins the shared synthetic-engagement gate
  # (scripts.artifact_boundary.synthetic_policy) and the quarantine-mode
  # output contract deterministically. No judge, threshold 1.0 — this is a
  # negative-gate / contract-shape case, not a "does the prose read well"
  # case (same pattern as roi-financial-modeler's overcap_negative_gate_witness).
  # quarantine_mode_outputs_local SKIPs gracefully until the "### Mode:
  # quarantine" block lands in #131 — RubricResult.score averages only
  # non-skipped checks, so the SKIP doesn't drag the mean below 1.0.
  knowledge-harvester:
    altitude: component
    threshold: 1.0
    input: evals/goldens/synthetic_gate
    code: [quarantine_policy_detected, never_policy_detected, bare_tests_fails_safe, quarantine_mode_outputs_local]

  ignite-workshop-synthesizer:
    altitude: component
    threshold: 0.80
    # Re-pointed from bare `nfis` (gitignored, vacuous) to a committed synthetic golden.
    input: evals/goldens/ignite_synthesis_golden.md   # scores specifics._ignite_synth via rubrics.component.ignite_workshop_synthesizer
    code: [hypothesis_validation_statuses, usecase_candidates_present, usecase_classification_present]
    path1_judge: [synthesis_faithful_to_workshops]

  # mcp-query-guard (PR #171 hardening) — regression coverage for the
  # .claude/hooks/mcp-query-guard.py fail-closed outbound-query gate
  # (security_protocol.md §5). No `input:` — the evaluator is self-contained:
  # every check synthesizes its own fixtures in a tempdir and invokes the
  # real hook script as a subprocess (never imports + monkeypatches it), so
  # there is no static golden file to point at.
  # threshold: 1.00 is a DELIBERATE deviation from the house 0.80 default —
  # this is a privacy/security control, pass/fail, not "mostly correct." No
  # `judge:` entries: every check is deterministic, $0, no LLM. Ticket #161
  # may later fold this into a broader `pii-anonymizer` row; standing this
  # up now is explicitly what #155's ticket permitted.
  # Post-711b56c hardening: the original 7 checks ran against a two-line
  # fixture stub that never exercised label-line extraction, ALL-CAPS
  # scoping, per-file read failures, case-insensitivity, or the
  # ENGAGEMENT_CONTEXT.md/engagement_intake.md scanning loop — certifying
  # 1.000 on a hook that failed all of those. The 6 checks below close that
  # gap; each was proven to fail against the specific mutation it targets
  # before being accepted (see the rubric module's evaluate() and the PR
  # description for the mutation-testing transcript).
  mcp-query-guard:
    altitude: component
    threshold: 1.00
    code: [denies_query_containing_client_identifier, allows_generic_query,
           detects_identifier_nested_in_dict_or_list, fails_closed_on_unresolvable_denylist,
           fails_closed_on_malformed_payload, allows_with_warning_when_no_denylist_configured,
           deny_decision_shape_matches_hook_contract, allows_query_with_common_emphasis_words,
           denies_bold_markdown_label_client_name, fails_closed_on_unreadable_profile_file,
           matching_is_case_insensitive, denies_identifier_from_engagement_context_file,
           denies_identifier_from_engagement_intake_file, denies_client_name_from_profile_name_label,
           ignores_unfilled_template_placeholders]

  # pii-anonymizer (ticket #161, PRD v6 §5, solution-design-v6.md D9) — the
  # acceptance gate for the whole v6 Presidio PII cycle. Covers
  # scripts/pii/engine.py (Presidio detection + reversible pseudonymisation)
  # and its scripts/anonymize_transcript.py facade against a committed
  # synthetic fixture (evals/goldens/pii_roundtrip_fixture.md).
  #
  # threshold: 1.00 is a DELIBERATE deviation from the house 0.80 default —
  # same rationale as mcp-query-guard above: a privacy control is pass/fail,
  # not "mostly correct." No `judge:` entries — every check is deterministic
  # and free.
  #
  # #161 runs 7th in the v6 build order, deliberately: this gate exists
  # before more code lands on top of it. The PRD's original 16-check list
  # names 6 checks whose SUBJECT does not exist yet and are therefore NOT
  # wired here — see evals/rubrics/component/pii_anonymizer.py's module
  # docstring "SEQUENCING" section for the full mapping to the tickets that
  # will add them:
  #   document_formats_converted_and_scrubbed   -> #162 — LANDED, wired below
  #   image_input_produces_sidecar_and_redacted_copy -> #163 — LANDED, wired below
  #   image_unreadable_script_refuses_and_writes_nothing -> #173 — LANDED, wired below
  #   guard_fails_closed_on_inputs_path         -> #164 — LANDED, wired below
  #   internal_domain_email_redacted_no_over_detection -> #181 — LANDED, wired below
  #   nested_outputs_deanonymized               -> #165 — LANDED, wired below
  #   xlsx_outputs_deanonymized                 -> #165 — LANDED, wired below
  #   workspace_paths_contain_no_client_identifiers -> #166 — LANDED, wired
  #                                                 below. The only PATH check
  #                                                 in the row: content
  #                                                 scrubbing is defeated by
  #                                                 the client-named path
  #                                                 compose_prompt renders on
  #                                                 every agent call (D6).
  #   mcp_query_client_name_blocked             -> already covered by the
  #                                                 mcp-query-guard row above;
  #                                                 intentionally not duplicated.
  #
  # Requires the Presidio-capable interpreter (scripts/pii/engine.py imports
  # presidio_analyzer at module level, needs Python 3.10-3.13): run this row
  # via `.venv/bin/python evals/run_experiment.py --component pii-anonymizer`
  # locally. In CI, requirements.txt (Presidio + spaCy model) is installed
  # under actions/setup-python's 3.11 before the suite runs, so
  # `sys.executable` there is already Presidio-capable.
  pii-anonymizer:
    altitude: component
    threshold: 1.00
    input: evals/goldens/pii_roundtrip_fixture.md
    code: [round_trip_byte_identical, distinct_values_distinct_placeholders,
           repeated_value_reuses_placeholder, no_raw_pii_in_anonymized_output,
           cross_transcript_merge_collision_free, mapping_files_chmod_600_and_cleaned,
           client_name_redacted_via_denylist, allowlist_prevents_generic_overredaction,
           empty_entity_list_warns, legacy_flat_mapping_still_restores,
           document_formats_converted_and_scrubbed,
           image_input_produces_sidecar_and_redacted_copy,
           image_unreadable_script_refuses_and_writes_nothing,
           guard_fails_closed_on_inputs_path,
           internal_domain_email_redacted_no_over_detection,
           nested_outputs_deanonymized,
           xlsx_outputs_deanonymized,
           workspace_paths_contain_no_client_identifiers]

  # run-experiment-runner (#183, closing PR 1 of the eval-gate-v7 epic) — the
  # SELF-GATE: this runner grades every other row in this file, so it must
  # grade itself too. Every check invokes the real evals/run_experiment.py as
  # a subprocess against a synthetic registry.yaml built fresh in a tempdir
  # (via CORTEX_EVAL_REGISTRY, added by this ticket) — never the file you are
  # reading right now, and never an in-process import-and-call.
  #
  # threshold: 1.00 — same rationale as mcp-query-guard/pii-anonymizer above:
  # the thing that decides pass/fail for every other row is pass/fail itself,
  # not "mostly correct." No `judge:`/`path1_judge:` entries — every check
  # here is deterministic, $0, and stays green with ANTHROPIC_API_KEY unset
  # (the "skipped judge" case simulates the no-key path; it never calls one).
  #
  # NOT wired here: `path1_refuses_in_ci`. Path-1's CI guard doesn't exist
  # until #204 — authoring a check for it now would have nothing to exercise
  # and could only ever render `[SKIP*]` under #181's skip-that-cannot-pass
  # rendering, which is noise, not signal, and exactly the "absence reads as
  # success" pattern this epic exists to remove. #204 adds it here.
  run-experiment-runner:
    altitude: component
    threshold: 1.00
    code: [component_negatives_honoured, missing_target_fails_not_skips,
           declared_checks_all_executed, skipped_judge_does_not_pass]
    # `mutations:` (#185) — the worked example for the --mutate runner mode.
    # These four were bite-proven by hand in #183 (see that PR's closing
    # comment and the PR #206 body for the transcript this reproduces
    # mechanically): each `find` targets the exact line the matching check
    # exercises, so mutating it makes ONLY that check go red.
    mutations:
      component_negatives_honoured:
        file: evals/run_experiment.py
        find: "passed if expect_pass else (not passed)"
        replace: "passed"
      missing_target_fails_not_skips:
        file: evals/run_experiment.py
        find: "f\"Failing rather than skipping — a skipped target previously left the verdict at PASS.\")\n            ok = False"
        replace: "f\"Failing rather than skipping — a skipped target previously left the verdict at PASS.\")"
      declared_checks_all_executed:
        file: evals/run_experiment.py
        find: "declared = code_names | {f\"judge:{j}\" for j in gating_judge_names}\n    if not declared:"
        replace: "declared = code_names | {f\"judge:{j}\" for j in gating_judge_names}\n    return True\n    if not declared:"
      skipped_judge_does_not_pass:
        file: evals/rubrics/base.py
        find: "mark = \"SKIP*\""
        replace: "mark = \"SKIP\""

# Pipeline (integration) altitude — the most important. When ANY component
# changes, run orchestrate.py end-to-end on a golden engagement and check the
# inter-agent contracts + final deliverable still hold.
pipeline:
  altitude: pipeline
  evaluator: rubrics.pipeline.contracts
  threshold: 0.90
  # Committed, anonymized golden engagement outputs (Path-2: score existing).
  # Re-pointed from a never-created `nfis` engagement — see PRD v1.
  golden_engagement: evals/goldens/pipeline_engagement/outputs
  orchestrate: orchestrate.py
