  # artifact-boundary (ticket #198, backlog :134) — executable coverage for the
  # three scripts/artifact_boundary.py gates other components depend on:
  # cap_roi_config, synthetic_policy and the deanonymize_dir exit gate.
  # Deliberately COMPLEMENTARY, never duplicative:
  #   * knowledge-harvester's row already scores synthetic_policy against the
  #     three committed fixtures (quarantine_case/, never_case/,
  #     bare_tests_case/). This row takes the branches that row cannot reach —
  #     marker-beats-location, the parent-directory walk, the two fail-safes
  #     for a missing/unrecognised harvest_policy, the "real" negative control,
  #     and an unreadable marker under a real chmod fault.
  #   * pii-anonymizer's nested_outputs_deanonymized / xlsx_outputs_deanonymized
  #     (#165) cover deanonymize_dir's recursive walk, exclusions and .xlsx
  #     branch. This row takes the two REFUSAL contracts they do not: a missing
  #     .pii_mapping.json must block and modify nothing, and a file that could
  #     not be restored must surface in `unrestored` with client_ready: false —
  #     never the silent skip that defect was written against.
  #   * roi-financial-modeler's backbase_impact_within_cap /
  #     overcap_negative_gate_witness prove the cap can be applied. This row
  #     adds the gate's own failure contract (missing / unparseable config) and
  #     asserts the already-capped golden is left byte-identical.
  # `input:` is the CAPPED golden; the over-cap negative is resolved as its
  # SIBLING, so the mutation harness's shadow_target() carries both fixtures
  # into the shadow together. cap_roi_config rewrites in place, so every check
  # gates a /tmp COPY and asserts the committed bytes are unchanged.
  # threshold 1.00, no judge: these are governance gates, pass/fail.
  artifact-boundary:
    altitude: component
    threshold: 1.00
    input: evals/goldens/roi_config_provenance.json
    code: [cap_roi_config_caps_driver_and_scenario_impacts,
           cap_roi_config_missing_or_unparseable_never_passes,
           synthetic_policy_marker_beats_location_and_unknown_policy_fails_safe,
           synthetic_policy_unreadable_marker_fails_safe_quarantine,
           deanonymize_dir_missing_mapping_blocks_and_modifies_nothing,
           deanonymize_dir_unreadable_output_reported_unrestored_not_client_ready]
    mutations:
      cap_roi_config_caps_driver_and_scenario_impacts:
        file: scripts/artifact_boundary.py
        find: "if isinstance(val, (int, float)) and val > MAX_BACKBASE_IMPACT:"
        replace: "if False:"
      cap_roi_config_missing_or_unparseable_never_passes:
        file: scripts/artifact_boundary.py
        find: "report[\"parse_error\"] = type(e).__name__"
        replace: "report[\"parse_error\"] = None"
      synthetic_policy_marker_beats_location_and_unknown_policy_fails_safe:
        file: scripts/artifact_boundary.py
        find: "if value not in _KNOWN_POLICIES:"
        replace: "if False:"
      synthetic_policy_unreadable_marker_fails_safe_quarantine:
        file: scripts/artifact_boundary.py
        find: "return (\"quarantine\",\n                            f\"marker at {marker} unreadable"
        replace: "return (\"real\",\n                            f\"marker at {marker} unreadable"
      deanonymize_dir_missing_mapping_blocks_and_modifies_nothing:
        file: scripts/artifact_boundary.py
        find: "report[\"error\"] = \"missing_pii_mapping\""
        replace: "report[\"client_ready\"] = True"
      deanonymize_dir_unreadable_output_reported_unrestored_not_client_ready:
        file: scripts/artifact_boundary.py
        find: "                        report[\"unrestored\"].append(str(out_file))\n\n            log(f\"  ✓ De-anonymized"
        replace: "                        pass\n\n            log(f\"  ✓ De-anonymized"

  # pipeline-workspace (ticket #198, backlog :134) — #167's guarantee, made
  # executable: NO composed prompt and NO cwd names the client. That claim was
  # verified once by a throwaway harness that stubbed _resilient_query and
  # walked every call site, and nothing in evals/ re-ran it; the structural
  # altitude scores fixtures and cannot see a regression here at all.
  # No `input:` — the evaluator is self-contained: it builds three synthetic
  # engagements in a tempdir in the PRE-MIGRATION, client-named shape (what
  # #167 has to neutralise) and drives the real orchestrate.py steps with
  # _resilient_query stubbed, so nothing leaves the machine. The three
  # traversals (non-interactive x3 transcripts, interactive x3, non-interactive
  # x1) between them execute all 26 run_agent call sites in orchestrate.py, and
  # `traversal_covers_every_agent_call_site` proves that against an AST
  # enumeration — a call site added later without coverage turns it red.
  # `denylist_nonempty_asserted_first` is FIRST structurally, not by convention:
  # evaluate() cannot launch the traversal without its return value, and an
  # empty deny-list leaves every other check reporting NOT EVALUATED.
  # REQUIRES the Presidio/SDK interpreter (orchestrate.py imports
  # claude_agent_sdk at module level; step_discovery runs the real anonymiser).
  # The rubric resolves it — `.venv/bin/python` locally, CI's sys.executable
  # after requirements.txt — and fails loudly naming `bash scripts/setup_pii.sh`
  # rather than skipping. The rubric itself runs fine under plain python3: the
  # traversal is a subprocess.
  # threshold 1.00, no judge: a privacy control is pass/fail.
  pipeline-workspace:
    altitude: component
    threshold: 1.00
    code: [denylist_nonempty_asserted_first,
           traversal_covers_every_agent_call_site,
           no_client_identifier_in_composed_prompt,
           cwd_is_neutral_workspace_for_every_invocation,
           neutral_invocation_assertion_refuses_client_named_cwd,
           workspace_root_placement_and_resume_reattaches,
           log_redaction_backstop_scrubs_client_paths]
    mutations:
      denylist_nonempty_asserted_first:
        file: scripts/pii/denylist.py
        find: "    engagement_dir = Path(engagement_dir)\n    terms = set()\n    budget = _ScanBudget()"
        replace: "    engagement_dir = Path(engagement_dir)\n    return set()"
      traversal_covers_every_agent_call_site:
        file: scripts/orchestrate.py
        find: "    if express or non_interactive:\n        result = await run_agent(\"roadmap-prioritization\", cwd=engagement_dir,"
        replace: "    if True:\n        result = await run_agent(\"roadmap-prioritization\", cwd=engagement_dir,"
      no_client_identifier_in_composed_prompt:
        file: scripts/orchestrate.py
        find: "        \"engagement_dir\": workspace_dir,\n        \"outputs_dir\": outputs_dir,\n        \"engagement_id\": engagement_id,"
        replace: "        \"engagement_dir\": engagement_dir,\n        \"outputs_dir\": outputs_dir,\n        \"engagement_id\": engagement_id,"
      cwd_is_neutral_workspace_for_every_invocation:
        file: scripts/orchestrate.py
        find: "    result = await run_agent(\n        \"knowledge-harvester\", cwd=workspace_dir,"
        replace: "    result = await run_agent(\n        \"knowledge-harvester\", cwd=engagement_dir,"
      neutral_invocation_assertion_refuses_client_named_cwd:
        file: scripts/orchestrate.py
        find: "    probe = str(text).replace(str(REPO_ROOT), \"\")\n    return sorted(set(_CLIENT_RE.findall(probe)))"
        replace: "    return []"
      workspace_root_placement_and_resume_reattaches:
        file: scripts/orchestrate.py
        find: "    ws = _identity.Workspace(path, engagement_dir, {})"
        replace: "    ws = _materialise_run_workspace(engagement_dir)"
      log_redaction_backstop_scrubs_client_paths:
        file: scripts/orchestrate.py
        find: "    if _REDACT_RE is None:\n        return msg\n    return _REDACT_RE.sub(\"<REDACTED>\", msg)"
