        find: "            if \"### Checkpoint:\" in journal.read_text(encoding=\"utf-8\", errors=\"replace\"):\n                return True"
        replace: "            if False:\n                return True"
      allows_checkpoint_file_itself:
        file: .claude/hooks/require-checkpoint.py
        find: "    if name.startswith((\".\", \"interim_\", \"CHECKPOINT\")):\n        return False"
        replace: "    if name.startswith((\".\", \"interim_\")):\n        return False"
      allows_non_deliverable_extension:
        file: .claude/hooks/require-checkpoint.py
        find: "DELIVERABLE_EXTS = {\".md\", \".html\", \".xlsx\", \".pptx\", \".pdf\", \".docx\", \".csv\"}"
        replace: "DELIVERABLE_EXTS = {\".md\", \".html\", \".xlsx\", \".pptx\", \".pdf\", \".docx\", \".csv\", \".json\"}"
      ignores_edit_tool:
        file: .claude/hooks/require-checkpoint.py
        find: "    if payload.get(\"tool_name\") != \"Write\":\n        _allow()"
