        find: "    try:\n        payload = json.load(sys.stdin)\n    except Exception:\n        _allow()"
        replace: "    try:\n        payload = json.load(sys.stdin)\n    except Exception:\n        _deny(\"mutated: a malformed payload must not deny\")"
      fails_open_under_injected_fault:
        file: .claude/hooks/require-checkpoint.py
        find: "        except OSError:\n            return True  # can't read — fail open"
        replace: "        except OSError:\n            return False"
      invoked_as_subprocess_not_import:
        file: .claude/hooks/require-checkpoint.py
        find: "PROJECT_DIR = Path(os.environ.get(\"CLAUDE_PROJECT_DIR\", Path.cwd()))"
        replace: "PROJECT_DIR = Path.cwd()"
      runs_under_registered_interpreter:
        file: evals/rubrics/_harness.py
        find: "    record_hook_invocation(argv)\n    completed = subprocess.run("
        replace: "    completed = subprocess.run("

  require-harness:
    altitude: component
    threshold: 1.00
    evaluator: rubrics.component.hooks.require_harness
    code: [denies_component_edit_without_active_change, allows_when_prd_artifact_present,
           denies_when_every_prd_is_closed, allows_when_prd_in_flight,
           repo_prd_state_matches_gate,
           allows_when_active_change_marker_present, exempts_harness_infra_paths,
           gates_pipeline_python_only_by_extension, gates_non_exempt_skill_but_not_bb_skill,
           gates_root_orchestrate_py, ignores_read_tool, fails_open_on_malformed_payload,
           fails_open_under_injected_fault, invoked_as_subprocess_not_import,
           runs_under_registered_interpreter]
    mutations:
      denies_component_edit_without_active_change:
        file: .claude/hooks/require-harness.py
        find: "    if not _is_protected(rel):\n        _allow()"
        replace: "    _allow()"
      allows_when_prd_artifact_present:
        file: .claude/hooks/require-harness.py
        find: "    if any(_prd_is_in_flight(p) for p in (PROJECT_DIR / \".prd\").glob(\"prd-v*.md\")):\n        return True"
        replace: "    if False:\n        return True"
      # The status rule, proved from both sides. Emptying the closed set makes a
      # shipped PRD read as in-flight (the old, broken behaviour) and must redden
      # the deny-side check; inverting the comparison makes every PRD read as
      # shipped and must redden the allow-side one.
      denies_when_every_prd_is_closed:
        file: .claude/hooks/require-harness.py
        find: "    \"archived\", \"built\", \"superseded\", \"shipped\", \"done\", \"abandoned\", \"merged\","
        replace: ""
