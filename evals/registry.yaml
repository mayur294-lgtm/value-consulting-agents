      # exactly the shipped-repo bug this check exists to catch.
      repo_prd_state_matches_gate:
        file: .claude/hooks/require-harness.py
        find: "                if line.startswith(\"status:\"):"
        replace: "                if False:"
      allows_when_active_change_marker_present:
        file: .claude/hooks/require-harness.py
