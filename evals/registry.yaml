# Cortex eval registry — the per-component / per-deliverable spec.
# run_experiment.py is driven entirely by this file. Add a row to bring a new
# agent/skill/deliverable under the harness. Existing components are adopted
# lazily (the seam): give them a row the next time they're touched.
#
# threshold = minimum mean rubric score to PASS (hard-fail checks override).
# evaluator = importable module exposing evaluate(target) -> list[CheckResult].

deliverables:
  deck:
    altitude: deliverable
    evaluator: rubrics.deliverable.decks
    threshold: 0.85
    goldens:
      - evals/goldens/deck_valid_min.html        # on-palette calibration anchor (post PR #71)
    negatives:
      - evals/goldens/negatives/deck_offpalette.html
    # Real shipped decks — scored by evals-monitor.yml (Loop 3). Most predate the
    # PR #71 palette correction (2026-06-22) and are EXPECTED to surface drift.
    monitor:
      - engagements/test_inspire/2026-02_retail_ignite/outputs/strategy_workshop_deck.html

  # SLOT RULE (see deck above): `goldens:` / `negatives:` are small, frozen,
  # COMMITTED fixtures authored to test the rubric — they are what the PR gate
  # runs. `monitor:` is real shipped engagement output, watched for drift by
  # evals-monitor.yml and NEVER gating. Real `engagements/**` paths must never
  # appear under `goldens:` — that tree is gitignored (PII), so the file is
  # absent in every clean checkout and CI, and a missing golden is [SKIP]-ed,
  # which counts as a PASS. That made these three gates vacuously green.
  roi:
    altitude: deliverable
    evaluator: rubrics.deliverable.roi
    threshold: 0.80
    goldens:
      - evals/goldens/roi_report_valid.md        # synthetic (Meridian Mutual) — exercises the rubric (markdown path)
      # :41 — the JSON path (_eval_json / value_lever_groups schema) had NO
      # golden coverage at all before this fix: the parser bug that scored a
      # correct current-schema roi_config.json 0/0 on Harborlight run 7 could
      # ship because nothing in this gate ever exercised evaluate() on a
      # .json target. Reusing the already-committed provenance golden (also
      # the wired `components.roi-financial-modeler` input) rather than
      # minting a new fixture.
      - evals/goldens/roi_config_provenance.json  # synthetic — current value_lever_groups schema (JSON path)
    negatives:
      # :41 — value_lever_groups present but the WRONG shape (an array, not
      # the contract's dict-of-dicts) must FAIL, not render unscorable —
      # that distinction is the whole point of the fix.
      - evals/goldens/negatives/roi_config_bad_schema.json
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v2/outputs/roi_report.md

  assessment:
    altitude: deliverable
    evaluator: rubrics.deliverable.assessment
    threshold: 0.80
    goldens:
      - evals/goldens/assessment_dashboard_valid.html   # synthetic — 7-act arc, on-palette
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v6/outputs/assessment_dashboard.html
      - engagements/nfis/2026-02_digital_investor_assessment_v2/outputs/assessment_dashboard.html

  report:
    altitude: deliverable
    evaluator: rubrics.deliverable.report
    threshold: 0.80
    goldens:
      - evals/goldens/assessment_report_valid.md        # synthetic — passes tone + assumption-discipline judges
    monitor:
      - engagements/nfis/2026-02_digital_investor_assessment_v6/outputs/assessment_report.md

# =============================================================================
# rubric_calibration — the CALIBRATION tier (#201, design D3/D7/D10)
# =============================================================================
# Eleven rows below score a frozen synthetic prose golden with a deterministic
# rubric. Until #201 they lived under `components:` KEYED BY AGENT NAME, which
# reads — in CI output, in a PR body, in a reviewer's head — as "this row gates
# that agent". It never did:
#
#     replacing the ENTIRE 45 KB `market-context-researcher` prompt with one
#     line of garbage left `--component market-context-researcher` at 1.000 PASS.
#
# The rubric does not execute a prompt. It reads a committed `.md` fixture that
# no agent run produced. What the score genuinely certifies is that the RUBRIC
# still parses that fixture the way it did when the threshold was set. That is
# worth keeping and was pressure-tested for deletion and KEPT: `evals/runtime.py`
# (wired at `scripts/orchestrate.py:2242` and `.claude/settings.json:74`) routes
# LIVE engagement outputs through the same `specifics.py` check functions on
# every pipeline run and every consultant session, so the golden is the
# calibration anchor that keeps that threshold falsifiable — and the only
# regression test on rubric code, which changed in all six of the last eval PRs.
# What was wrong was never the file. It was the CLAIM attached to it.
#
# THE RULES OF THIS TIER
# ----------------------
# 1. Keyed by RUBRIC, never by an agent name (enforced: check_registry.py's
#    `check_rubric_calibration`). `--component <agent-name>` does not resolve to
#    a calibration row; the retired agent names keep a REDIRECT row at the end of
#    `components:` that always hard-fails with the mapping.
# 2. `covers_agent:` is INERT DOCUMENTATION. No runner, preflight or harness
#    reads it as a verification claim, and check_registry.py asserts the agent it
#    names cannot be reached as a gate.
# 3. Every `code:` check carries its own per-check FIXTURE-MUTATION negative
#    (design D3) under `negatives:` as a MAPPING — `{check: {strip: <regex>}}`,
#    or `{check: {find: ..., replace: ...}}` where the fault has to be ADDED
#    rather than removed. `evals/mutations.py` reads that shape as
#    `kind: "fixture"` and `--mutate <row>` proves each one makes THAT NAMED
#    check go red. A whole-artifact negative could not do this: at threshold
#    0.80 it only has to break a fifth of the checks to drop below the line, so
#    an individually inert check still hides.
# 4. GOLDEN BYTES ARE FROZEN (design D7). Editing a golden while adding its
#    first negative confounds the calibration — a new red could not be
#    attributed to the better negative rather than the changed fixture. The weak
#    cross-scoring discrimination (`market-context-researcher` scores 0.833
#    against the BENCHMARK golden; `benchmark-librarian` 0.889 against the
#    MARKET-CONTEXT one) is a recorded follow-up, not this ticket.
# 5. `rubrics/component/specifics.py` is FROZEN this cycle (design D10) —
#    `runtime.py` scores live client engagements with it. Every negative below is
#    a fixture mutation for that reason: it changes a shadow copy of the golden,
#    never the rubric.
#
# DISPATCH
# ---------------------------------------------------------------------
#   python evals/run_experiment.py --calibration market-context-rubric
#   python evals/run_experiment.py --mutate      market-context-rubric
#
# A DEDICATED FLAG, not `--component`. #201 shipped these rows YAML-aliased back
# into `components:` because `run_experiment.py` was owned by a concurrent ticket
# (#204) and had no branch for this section. #204 landed; the runner now reads
# this section directly (`_CALIBRATION_KEY`), and the alias block is deleted.
#
# The separate flag is the point, not a detail of the migration: a row that
# answers to `--component` reads as a component gate to every reader and every
# quoted number, and these rows gate no component — replacing the whole 45 KB
# `market-context-researcher` prompt with one line of garbage left its old
# agent-keyed row at 1.000 PASS. `--component <rubric>` now prints that redirect
# instead of scoring, `--component <agent>` hits the hard-failing `retired:`
# redirect row, and every run here prints the tier banner.
#
# Two preflight assertions hold the shape (check_registry.check_rubric_calibration):
# a calibration row must NOT appear in `components:` (the shim cannot grow back),
# and `run_experiment.py` must still carry a `--calibration` dispatch reading this
# section (an unrunnable row is a gate nobody can run, which reads as "nothing
# failed"). CI derives its `--mutate` row list from this section too
# (.github/workflows/evals.yml).
rubric_calibration:

  market-context-rubric:
    tier: rubric_calibration
    altitude: component          # the runner's dispatch altitude, NOT this row's tier
    threshold: 0.80
    evaluator: rubrics.component.market_context_researcher
    covers_agent: market-context-researcher    # INERT DOCUMENTATION — not a verification claim
    input: evals/goldens/market_context_golden.md
    code: [annual_report_attempted, module1_metrics_present, competitor_benchmark_section]
    path1_judge: [sources_credible_not_hallucinated]
    negatives:
      annual_report_attempted:
        strip: '(?i)annual report|statement of income|10-k|call report|ncua|top-down|revenue bridge|financial metrics'
      module1_metrics_present:
        strip: '(?i)module\s*1|bottom-up|correlation'
      competitor_benchmark_section:
        strip: '(?i)competitor|benchmark|peer|module\s*3'

  roi-hypothesis-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.roi_hypothesis_builder
    covers_agent: roi-hypothesis-builder        # INERT DOCUMENTATION
    input: evals/goldens/roi_hypothesis_golden.md
    code: [lever_ids_present, four_link_chain_present, problem_statement_present]
    path1_judge: [levers_grounded_in_evidence]
    negatives:
      lever_ids_present:
        strip: '(?im)\bL\d+\b'
      four_link_chain_present:
        strip: '(?i)root driver|operational change|volume|financial impact'
      problem_statement_present:
        strip: '(?i)problem\s+statement|problem\s+type'

  discovery-evidence-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.discovery_transcript_interpreter
    covers_agent: discovery-transcript-interpreter    # INERT DOCUMENTATION
    input: evals/goldens/discovery_evidence_register_golden.md
    code: [evidence_ids_wellformed, evidence_register_present, lifecycle_tags_present, pain_points_present]
    path1_judge: [faithful_extraction_no_invention]
    negatives:
      evidence_ids_wellformed:
        strip: '\bE\d+\b'
      evidence_register_present:
        strip: '(?im)evidence\s+register|^##\s*evidence'
      lifecycle_tags_present:
        strip: '(?i)\b(?:acquire|activate|expand|retain)\b'
      pain_points_present:
        strip: '(?im)pain\s*point|^##\s*pain'

  capability-maturity-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.capability_assessment
    covers_agent: capability-assessment         # INERT DOCUMENTATION
    input: evals/goldens/capability_assessment_golden.md
    code: [maturity_scale_0_4, executive_summary_present, front_middle_back_layers, unconsidered_needs_present, scores_have_evidence_refs]
    path1_judge: [scores_justified_by_evidence]
    negatives:
      # Lookahead so the shared table pipe is not consumed: `| 2 | 3 |` must
      # lose BOTH cells, not just the first non-overlapping match.
      maturity_scale_0_4:
        strip: '\|\s*[0-4]\s*(?=\|)'
      executive_summary_present:
        strip: '(?im)^##\s*\d*\.?\s*executive summary.*$'
      # Drops one of the three layer words: 2/3 scores 0.67 and FAILS the >=3
      # target — the most surgical mutation that reddens this check alone.
      front_middle_back_layers:
        strip: '(?i)\bfront\b'
      unconsidered_needs_present:
        strip: '(?i)unconsidered'
      scores_have_evidence_refs:
        strip: '(?i)\bCAP-[A-Z0-9-]+\b|\bE\d+\b'

  roadmap-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.roadmap_prioritization
    covers_agent: roadmap-prioritization        # INERT DOCUMENTATION
    input: evals/goldens/roadmap_golden.md
    code: [phases_present, initiatives_sequenced, dependencies_present, gates_or_milestones_present]
    path1_judge: [initiatives_traced_to_gaps_and_levers]
    negatives:
      phases_present:
        strip: '(?i)phase\s*[1-3]|wave\s*[1-3]|now.*next.*later'
      initiatives_sequenced:
        strip: '(?i)\bRI-\d+\b|initiative'
      dependencies_present:
        strip: '(?i)dependenc'
      gates_or_milestones_present:
        strip: '(?i)decision gate|\bDG-\d|milestone|value\s*realization'

  narrative-arc-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.narrative_assembler
    covers_agent: narrative-assembler           # INERT DOCUMENTATION
    input: evals/goldens/narrative_golden.md
    code: [seven_acts_present, executive_summary_present, transformation_arc_present]
    path1_judge: [transformation_arc_threaded_7_acts]   # the documented assembler weakness
    negatives:
      # One act removed: 6/7 distinct acts scores 0.857 and fails the >=7 bar.
      seven_acts_present:
        strip: '(?i)\bact\s*7\b'
      executive_summary_present:
        strip: '(?i)executive summary'
      transformation_arc_present:
        strip: '(?i)transformation|from\b.*?\bto\b'

  journey-map-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.journey_builder
    covers_agent: journey-builder               # INERT DOCUMENTATION
    input: evals/goldens/journey_maps_golden.md
    code: [lifecycle_stages_present, friction_or_leakage_present, as_is_and_future_state]
    path1_judge: [value_leakage_quantified]
    negatives:
      lifecycle_stages_present:
        strip: '(?i)\b(?:acquire|activate|expand|retain)\b'
      friction_or_leakage_present:
        strip: '(?i)friction|value\s*leakage|leakage\s*waterfall'
      # Removes only the FUTURE half of the As-Is/Future-State conjunction.
      as_is_and_future_state:
        strip: '(?i)future[- ]state'

  benchmark-shortlist-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.benchmark_librarian
    covers_agent: benchmark-librarian           # INERT DOCUMENTATION
    input: evals/goldens/benchmark_golden.md
    code: [confidence_levels_present, source_attribution_present, no_synthetic_citations]
    path1_judge: [benchmarks_defensible_not_hallucinated]
    negatives:
      confidence_levels_present:
        strip: '(?i)confidence\s*level|(?:high|medium|low)\s*confidence|confidence:\s*(?:high|medium|low)'
      source_attribution_present:
        strip: '(?i)source\s*:|\[(?:annual report|investor presentation|regulator|not available|consultant-provided|industry|proxy|estimated)[^\]]*\]'
      # INVERTED CHECK — it passes on the ABSENCE of stray [Synthetic-Test]
      # citations, so a `strip:` can never redden it. The fixture mutation has to
      # ADD the fault: `{find, replace}` under `negatives:` is still read as
      # kind "fixture" (mutations.Mutation.from_entry), so this stays a
      # golden-side mutation and specifics.py is untouched (D10).
      no_synthetic_citations:
        find: '## Gaps and validation asks'
        replace: "## Gaps and validation asks\n\n- Contact-centre deflection benchmark carried over from [Synthetic-Test] pipeline data.\n"

  usecase-design-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.usecase_designer
    covers_agent: usecase-designer              # INERT DOCUMENTATION
    input: evals/goldens/usecase_golden.md
    code: [usecase_ids_present, product_directory_mapping, ootb_config_custom_classification, priority_tiers_present]
    path1_judge: [usecases_grounded_in_product_directory]
    negatives:
      usecase_ids_present:
        strip: '(?i)\bUC-\d{2,}\b'
      product_directory_mapping:
        strip: '(?i)product directory|\bRB\.\d|\bWB\.\d'
      ootb_config_custom_classification:
        strip: '(?i)OOTB|out-of-the-box|config(?:ure|uration)?|custom'
      priority_tiers_present:
        strip: '(?i)tablestakes|differentiating|\bP[123]\b'

  workshop-prep-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.workshop_preparation
    covers_agent: workshop-preparation          # INERT DOCUMENTATION
    input: evals/goldens/workshop_prep_golden.md
    code: [hypotheses_present, validation_questions_present, checkpoint_present]
    path1_judge: [hypotheses_specific_and_quantified]
    negatives:
      hypotheses_present:
        strip: '(?i)hypothes[ie]s'
      validation_questions_present:
        strip: '(?i)validation question|questions? to validate|validate'
      checkpoint_present:
        strip: '(?i)checkpoint'

  workshop-synthesis-rubric:
    tier: rubric_calibration
    altitude: component
    threshold: 0.80
    evaluator: rubrics.component.ignite_workshop_synthesizer
    covers_agent: ignite-workshop-synthesizer   # INERT DOCUMENTATION
    input: evals/goldens/ignite_synthesis_golden.md
    code: [hypothesis_validation_statuses, usecase_candidates_present, usecase_classification_present]
    path1_judge: [synthesis_faithful_to_workshops]
    negatives:
      # "partially confirmed" / "not confirmed" both contain "confirmed", so one
      # strip takes 3 of the 4 status labels; "needs more data" survives at 1/2.
      hypothesis_validation_statuses:
        strip: '(?i)confirmed'
      usecase_candidates_present:
        strip: '(?i)use\s*case'
      usecase_classification_present:
        strip: '(?i)quick win|foundational|transformational|defer'

# Component (unit) altitude — score an agent's direct output on a fixed input.
#
# Two declaration keys, two different contracts (#182, D5 — "declared means
# required"):
#   code:         GATES. Deterministic Python checks that
#                 `run_experiment.py --component <name>` actually executes on
#                 every run; `declared_checks_all_executed` asserts every name
#                 listed here produced a CheckResult, or the run fails naming it.
#   path1_judge:  Does NOT gate. Semantic LLM-as-judge checks that apply only
#                 when the component is regenerated via path-1
#                 (evals/path1.py --agent <name>, #204) — the component gate's
#                 thin adapters (rubrics/component/<name>.py) call only
#                 specifics._<fn> and never reach these, by design (a metered
#                 judge must never sit on a gating path — CI stays key-free).
# A row may still legitimately declare a gating `judge:` (none do post-migration,
# but the key remains meaningful) — if it does, that name is asserted executed
# too, exactly like `code:`.
#
# All `code` checks below are implemented in rubrics.component.specifics (which
# runs on top of the rubrics.component.governance baseline that every agent
# inherits); `path1_judge` checks are the semantic LLM rubrics in rubrics.judge.
components:
  roi-financial-modeler:
    altitude: component
    # threshold raised 0.80 -> 0.90 (#180): backbase_impact_within_cap stays a
    # plain mean-contributor (no hard_fail — see D10, specifics.py frozen this
    # cycle). At 0.90 the overcap negative (scores 0.889, 8/9 checks) correctly
    # FAILS via ordinary mean scoring, while the positive golden (1.000) still
    # clears it comfortably. Per D3, a per-check hard_fail fix is deferred to #201.
    threshold: 0.90
    # Fixture: the committed anonymized provenance golden (the basis the provenance
    # fix was built on). Re-pointed from a never-created `nfis` golden — see PRD v1.
    input: evals/goldens/roi_config_provenance.json
    negatives:
      - evals/goldens/roi_config_overcap.json
    code: [three_scenarios, npv_payback_present, assumptions_register_present, sensitivity_analysis_present,
           basic_information_has_sources_list, basic_fields_have_source_and_confidence, operating_costs_emitted_as_formula,
           backbase_impact_within_cap, overcap_negative_gate_witness]
    path1_judge: [conservative_bias, topdown_bottomup_correlation]
    # #104 parity case (standalone /build-roi + /generate-roi-excel now run the
    # same artifact_boundary.py cap_roi_config gate the pipeline runs, #102):
    #   - goldens: roi_config_provenance.json above (the wired `input:`) is
    #     already capped — `backbase_impact_within_cap` must PASS on it.
    #   - negatives: evals/goldens/roi_config_overcap.json — a >0.60 backbase_impact
    #     (driver-level + scenario-level) with scenario numbers that push the
    #     curve-adjusted 5-yr ROI (279%) outside the Retail Banking benchmark
    #     (100-150%). As of #180, `components:` altitude DOES wire a `negatives:`
    #     list the same way `deliverables:` does (see run_experiment.py) — `--negatives`
    #     runs this fixture through the same evaluator with expect_pass=False, so
    #     the gate only passes if `backbase_impact_within_cap` (hard_fail, see
    #     rubrics/component/specifics.py) correctly fails on it. The
    #     `overcap_negative_gate_witness` check below predates #180 and is kept as
    #     an additional, self-contained witness: it loads this same fixture directly
    #     and proves it FAILS `backbase_impact_within_cap` pre-gate, then gates a
    #     /tmp COPY of it (scripts/artifact_boundary.py cap_roi_config — never
    #     mutates the committed fixture) and proves the capped copy PASSES the
    #     same invariant.

  # roi-excel-generator (#85) — verifies the GENERATOR actually renders the
  # provenance contract the roi-financial-modeler agent emits (#83 generator,
  # #84 agent contract): Sources sheet, explicit confidence wins over the
  # keyword heuristic, Operating Costs as a live formula, derived driver
  # formulas. Deterministic code checks only — no judge this cycle.
  # Two self-contained goldens (no engagement-output path resolution at
  # runtime): one WITH the full provenance contract, one WITHOUT it (the
  # backward-compat witness — must still generate clean with no Sources sheet).
  roi-excel-generator:
    altitude: component
    threshold: 0.80
    input: evals/goldens/roi_config_provenance.json
    code: [sources_sheet_present, sources_sheet_absent_when_unset, no_confidence_row_leak,
           explicit_confidence_wins, operating_costs_is_formula, derived_input_formula_renders]

  # knowledge-harvester (#130) — pins the shared synthetic-engagement gate
  # (scripts.artifact_boundary.synthetic_policy) and the quarantine-mode
  # output contract deterministically. No judge, threshold 1.0 — this is a
  # negative-gate / contract-shape case, not a "does the prose read well"
  # case (same pattern as roi-financial-modeler's overcap_negative_gate_witness).
  # quarantine_mode_outputs_local SKIPs gracefully until the "### Mode:
  # quarantine" block lands in #131 — RubricResult.score averages only
  # non-skipped checks, so the SKIP doesn't drag the mean below 1.0.
  knowledge-harvester:
    altitude: component
    threshold: 1.0
    input: evals/goldens/synthetic_gate
    code: [quarantine_policy_detected, never_policy_detected, bare_tests_fails_safe, quarantine_mode_outputs_local]

  # mcp-query-guard (PR #171 hardening) — regression coverage for the
  # .claude/hooks/mcp-query-guard.py fail-closed outbound-query gate
  # (security_protocol.md §5). No `input:` — the evaluator is self-contained:
  # every check synthesizes its own fixtures in a tempdir and invokes the
  # real hook script as a subprocess (never imports + monkeypatches it), so
  # there is no static golden file to point at.
  # threshold: 1.00 is a DELIBERATE deviation from the house 0.80 default —
  # this is a privacy/security control, pass/fail, not "mostly correct." No
  # `judge:` entries: every check is deterministic, $0, no LLM. Ticket #161
  # may later fold this into a broader `pii-anonymizer` row; standing this
  # up now is explicitly what #155's ticket permitted.
  # Post-711b56c hardening: the original 7 checks ran against a two-line
  # fixture stub that never exercised label-line extraction, ALL-CAPS
  # scoping, per-file read failures, case-insensitivity, or the
  # ENGAGEMENT_CONTEXT.md/engagement_intake.md scanning loop — certifying
  # 1.000 on a hook that failed all of those. The 6 checks below close that
  # gap; each was proven to fail against the specific mutation it targets
  # before being accepted (see the rubric module's evaluate() and the PR
  # description for the mutation-testing transcript).
  # #192/backlog :116: the rubric used to invoke the hook via
  # `[sys.executable, ...]` — CI's/this venv's interpreter — instead of the
  # bare `python3` .claude/settings.json actually registers for it (what
  # every consultant session runs under). Migrated to
  # rubrics/_harness.py's `registered_interpreter()`, which parses
  # settings.json and fails loudly if the hook isn't registered rather than
  # falling back. `runs_under_registered_interpreter` (below) is the new
  # check proving that resolution. No `mutations:` key added: adding one
  # requires covering every declared check on the row (#186), which is out
  # of scope here — this row stays in the keyless DEBT list.
  mcp-query-guard:
    altitude: component
    threshold: 1.00
    code: [denies_query_containing_client_identifier, allows_generic_query,
           detects_identifier_nested_in_dict_or_list, fails_closed_on_unresolvable_denylist,
           fails_closed_on_malformed_payload, allows_with_warning_when_no_denylist_configured,
           deny_decision_shape_matches_hook_contract, allows_query_with_common_emphasis_words,
