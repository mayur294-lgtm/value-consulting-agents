  # run-experiment-runner (#183, closing PR 1 of the eval-gate-v7 epic) — the
  # SELF-GATE: this runner grades every other row in this file, so it must
  # grade itself too. Every check invokes the real evals/run_experiment.py as
  # a subprocess against a synthetic registry.yaml built fresh in a tempdir
  # (via CORTEX_EVAL_REGISTRY, added by this ticket) — never the file you are
  # reading right now, and never an in-process import-and-call.
  #
  # threshold: 1.00 — same rationale as mcp-query-guard/pii-anonymizer above:
  # the thing that decides pass/fail for every other row is pass/fail itself,
  # not "mostly correct." No `judge:`/`path1_judge:` entries — every check
  # here is deterministic, $0, and stays green with ANTHROPIC_API_KEY unset
  # (the "skipped judge" case simulates the no-key path; it never calls one).
  #
  # `path1_refuses_in_ci` (#204, wired in the epic's closing pass): path-1
  # regeneration actually runs an agent through `claude -p` on a human's
  # subscription. It is nondeterministic, metered, and NOT a gate, so both
  # routes into it (`evals/path1.py` directly, and `run_experiment.py
  # --regenerate`) hard-refuse under $CI / $GITHUB_ACTIONS. That refusal is
  # the only thing standing between CI and a nondeterministic agent run, so
  # it gets a check like everything else in this epic.
  run-experiment-runner:
    altitude: component
    threshold: 1.00
    code: [component_negatives_honoured, missing_target_fails_not_skips,
           declared_checks_all_executed, skipped_judge_does_not_pass,
           retired_altitude_flag_hard_errors, path1_refuses_in_ci]
    # `mutations:` (#185) — the worked example for the --mutate runner mode.
    # These four were bite-proven by hand in #183 (see that PR's closing
    # comment and the PR #206 body for the transcript this reproduces
    # mechanically): each `find` targets the exact line the matching check
    # exercises, so mutating it makes ONLY that check go red.
    mutations:
      component_negatives_honoured:
        file: evals/run_experiment.py
        find: "passed if expect_pass else (not passed)"
        replace: "passed"
      missing_target_fails_not_skips:
        file: evals/run_experiment.py
        find: "f\"Failing rather than skipping — a skipped target previously left the verdict at PASS.\")\n            ok = False"
        replace: "f\"Failing rather than skipping — a skipped target previously left the verdict at PASS.\")"
      declared_checks_all_executed:
        file: evals/run_experiment.py
        find: "declared = code_names | {f\"judge:{j}\" for j in gating_judge_names}\n    if not declared:"
        replace: "declared = code_names | {f\"judge:{j}\" for j in gating_judge_names}\n    return True\n    if not declared:"
      skipped_judge_does_not_pass:
        file: evals/rubrics/base.py
        find: "mark = \"SKIP*\""
        replace: "mark = \"SKIP\""
      # #188 correction pass. #188 shipped the retired-altitude guard and the
      # grep that protects it with NO check over either — the epic's own gate,
      # unproven, in the epic that exists to stop exactly that. This mutation
      # DELETES the three-line guard in main()'s altitude validation. The
      # deletion is invisible to exit code (the retired name then falls through
      # to the `_ALTITUDES` membership test and argparse's ap.error() also exits
      # 2), which is why the check asserts on the rename rationale text.
      retired_altitude_flag_hard_errors:
        file: evals/run_experiment.py
        find: "    if args.altitude == _RETIRED_ALTITUDE:\n        print(_RETIRED_ALTITUDE_ERROR, file=sys.stderr)\n        return 2\n"
        replace: ""
      # Disables `_in_ci()` at its SINGLE source of truth. Both refusal call
      # sites — path1.main()'s pre-argparse guard and run_experiment.py
      # --regenerate's delegation to path1.refuse_if_ci() — go through this one
      # function, so the mutation reddens the check via both routes at once and
      # cannot be dodged by a second copy of the env-var test appearing
      # somewhere else.
      path1_refuses_in_ci:
        file: evals/path1.py
        find: "    return any(os.environ.get(v) for v in _CI_ENV_VARS)"
        replace: "    return False"

  # mutation-harness (#187, closing PR 2 of the eval-gate-v7 epic) — the
  # SECOND self-gate: run-experiment-runner (above) proves the runner that
  # grades every row; this row proves the MUTATION machinery every row's
  # `mutations:` proof depends on — evals/mutations.py, run_experiment.py's
  # `--mutate` mode, and check_registry.py's mutation-coverage preflight.
  # Every check drives those REAL modules as subprocesses against synthetic
  # fixtures (never an import-and-call) — see
  # evals/rubrics/component/mutation_harness.py's module docstring for the
  # two subprocess strategies (CORTEX_EVAL_REGISTRY for run_experiment.py,
  # a copied-check_registry.py tempdir for check_registry.py, which refuses
  # that env var on itself) and for why every mutation below is safe to
  # apply even though several of them target isolation/enforcement code.
  #
  # threshold: 1.00 — same rationale as run-experiment-runner above: this
  # row certifies the proof mechanism itself, not "mostly correct."
  #
  # Added to MUTATION_PROOF_REQUIRED_ROWS in check_registry.py by this same
  # ticket — hard-enforced from birth, no grace period.
  mutation-harness:
    altitude: component
    threshold: 1.00
    code: [every_registered_check_has_a_mutation, mutation_makes_named_check_red,
           restore_makes_it_green, check_without_mutation_fails_preflight,
           working_tree_unchanged_after_run]
    mutations:
      every_registered_check_has_a_mutation:
        file: evals/check_registry.py
        find: "    if name in MUTATION_PROOF_REQUIRED_ROWS:\n        return True"
        replace: "    if False:\n        return True"
      mutation_makes_named_check_red:
        file: evals/mutations.py
        find: "    return not check[\"passed\"] and not check[\"skipped\"] and not check[\"unscorable\"]"
        replace: "    return False"
      restore_makes_it_green:
        file: evals/run_experiment.py
        find: "ok = _evaluate_targets(args.component, evaluator, \"unit\", thr, [tgt], expect_pass=True, spec=spec)"
        replace: "ok = _evaluate_targets(args.component, evaluator, \"unit\", thr, [tgt], expect_pass=True, spec=spec)\n        ok = False"
      check_without_mutation_fails_preflight:
        file: evals/check_registry.py
        find: "        if hard:\n            errors.append(msg)"
        replace: "        if False:\n            errors.append(msg)"
      working_tree_unchanged_after_run:
        file: evals/mutations.py
        find: "        shadow = Path(td) / \"repo\"\n        shadow.mkdir()"
        replace: "        shadow = src_root / \".mutation_shadow_leak\" / \"repo\"\n        shadow.mkdir(parents=True, exist_ok=True)"

  # --- #197: executable rows for the six ungated `.claude/hooks/*` --------------
  #
  # `.claude/settings.json` registers SEVEN Python hooks. Before this block only
  # `mcp-query-guard` had a row, and `anonymize-guard` was covered by exactly one
  # check inside the `pii-anonymizer` row (`guard_fails_closed_on_inputs_path`,
  # #164 — deliberately left where it is, it is that row's own acceptance
  # criterion). Hooks are the enforcement layer for every governance rule this
  # repo claims to hold (.design/solution-design-v6.md D7), so an ungated hook is
  # a rule that exists only in prose.
  #
  # All six evaluators live in ONE package, `evals/rubrics/component/hooks/`, so
  # each row names its module explicitly with `evaluator:` rather than relying on
  # run_experiment.py's `rubrics.component.<row>` default. No `input:` — every
  # evaluator is self-contained: it synthesizes fixtures in a tempdir, points
  # `CLAUDE_PROJECT_DIR` at them, and invokes the real hook SCRIPT as a
  # subprocess (never imports + monkeypatches it), so there is no static golden
  # to point at. Same shape as `mcp-query-guard` above.
  #
  # threshold 1.00 on all six — the house 0.80 default is wrong for a
  # privacy/governance control, which is pass/fail, not "mostly correct". No
  # `judge:`/`path1_judge:` entries: every check is deterministic, offline, and
  # stays green with ANTHROPIC_API_KEY unset.
  #
  # FAIL-CLOSED vs FAIL-OPEN IS PER-HOOK. Only `anonymize-guard` has a
  # fail-CLOSED contract, and only inside `engagements/*/inputs/` — a globally
  # fail-closed guard wedged every session once already (PR #82). So
  # `fails_closed_under_injected_fault` appears on that row alone, and the other
  # five carry `fails_open_under_injected_fault`, which asserts the contract
  # those hooks actually document. Each is a SPLIT, never "a decision happens
  # somewhere": the same fixture decides one way clean and the other way faulted.
  #
  # `mutations:` on all six, covering every declared check (66/66 proven red
  # under mutation and green on restore). Add all six names to
  # MUTATION_PROOF_REQUIRED_ROWS in evals/check_registry.py in the SAME change,
  # per that list's own rule — they are hard-enforced from birth either way,
  # since declaring a `mutations:` key removes the DEBT grace period.
  #
  # Several `runs_under_registered_interpreter` mutations target
  # evals/rubrics/_harness.py's `record_hook_invocation(argv)` call rather than a
  # hook: deleting it is the one edit that reddens ONLY that check (the harness's
  # own docstring names this — "a capture that records nothing is itself a hard
  # failure"). If that line moves, these six `find:` strings go stale and
  # --mutate reports INERT, which is the intended loud failure.
  anonymize-guard:
    altitude: component
    threshold: 1.00
    evaluator: rubrics.component.hooks.anonymize_guard
    code: [denies_unscrubbed_text_input, allows_scrubbed_anon_artifact,
           allows_when_sibling_is_current, denies_stale_sibling_by_mtime,
           denies_document_without_md_sidecar, denies_unsupported_format_outright,
           allows_paths_outside_inputs_scope, gates_bash_command_reading_raw_input,
           allows_bash_anonymizer_command_itself, fails_closed_under_injected_fault,
           degenerate_path_fails_closed_only_inside_inputs, invoked_as_subprocess_not_import,
           runs_under_registered_interpreter]
    mutations:
      denies_unscrubbed_text_input:
        file: .claude/hooks/anonymize-guard.py
        find: "            if kind == \"text\":\n                return _msg_unscrubbed_text(p)"
        replace: "            if kind == \"text\":\n                return None"
      allows_scrubbed_anon_artifact:
        file: .claude/hooks/anonymize-guard.py
        find: "        if p.name.startswith(ANON_PREFIX):"
        replace: "        if False:"
      allows_when_sibling_is_current:
        file: .claude/hooks/anonymize-guard.py
        find: "        if p.stat().st_mtime > sibling.stat().st_mtime:"
        replace: "        if True:"
      denies_stale_sibling_by_mtime:
        file: .claude/hooks/anonymize-guard.py
        find: "        if p.stat().st_mtime > sibling.stat().st_mtime:"
        replace: "        if False:"
      denies_document_without_md_sidecar:
        file: .claude/hooks/anonymize-guard.py
        find: "    if kind == \"text\":\n        return p.with_name(ANON_PREFIX + p.name)\n    return p.with_name(ANON_PREFIX + p.name + \".md\")"
        replace: "    return p.with_name(ANON_PREFIX + p.name)"
      denies_unsupported_format_outright:
        file: .claude/hooks/anonymize-guard.py
        find: "        if kind is None:\n            return _msg_unsupported(p)"
        replace: "        if kind is None:\n            return None"
      allows_paths_outside_inputs_scope:
        file: .claude/hooks/anonymize-guard.py
        find: "    parts = [part.lower() for part in p.parts]\n    return \"engagements\" in parts and \"inputs\" in parts"
        replace: "    parts = [part.lower() for part in p.parts]\n    return \"engagements\" in parts"
      gates_bash_command_reading_raw_input:
        file: .claude/hooks/anonymize-guard.py
        find: "        cands.append(tok)"
        replace: "        continue"
      allows_bash_anonymizer_command_itself:
        file: .claude/hooks/anonymize-guard.py
        find: "    if any(hint in command for hint in _ANONYMIZER_HINTS):"
        replace: "    if False:"
      fails_closed_under_injected_fault:
        file: .claude/hooks/anonymize-guard.py
        find: "    except Exception:\n        if in_scope_guess:\n            return _msg_fault(raw)\n        return None"
        replace: "    except Exception:\n        return None"
      degenerate_path_fails_closed_only_inside_inputs:
        file: .claude/hooks/anonymize-guard.py
        find: "        if in_scope_guess:\n            return _msg_fault(raw)"
        replace: "        if True:\n            return _msg_fault(raw)"
      invoked_as_subprocess_not_import:
        file: .claude/hooks/anonymize-guard.py
        find: "PROJECT_DIR = Path(os.environ.get(\"CLAUDE_PROJECT_DIR\", Path.cwd()))"
        replace: "PROJECT_DIR = Path.cwd()"
      runs_under_registered_interpreter:
        file: evals/rubrics/_harness.py
        find: "    record_hook_invocation(argv)\n    completed = subprocess.run("
        replace: "    completed = subprocess.run("

  require-checkpoint:
    altitude: component
    threshold: 1.00
    evaluator: rubrics.component.hooks.require_checkpoint
    code: [denies_deliverable_write_without_checkpoint, allows_when_checkpoint_file_present,
           allows_when_journal_has_checkpoint_block, allows_checkpoint_file_itself,
