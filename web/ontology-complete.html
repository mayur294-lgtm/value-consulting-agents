function hiNode(id){const c=new Set([id]);L.forEach(x=>{const s=typeof x.source==='string'?x.source:x.source.id;const t=typeof x.target==='string'?x.target:x.target.id;if(s===id)c.add(t);if(t===id)c.add(s)});nd.select('circle').attr('fill-opacity',d=>c.has(d.id)?0.2:0.02).attr('stroke-opacity',d=>c.has(d.id)?0.9:0.04).attr('stroke-width',d=>d.id===id?2.5:c.has(d.id)?1.2:0.5);nd.selectAll('text').attr('fill-opacity',d=>c.has(d.id)?1:0.06);lk.attr('stroke-opacity',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?0.5:0.01}).attr('stroke-width',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?2:0.5});ll.attr('display',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?'block':'none'}).attr('fill','#64748B').attr('font-size','7px')}
function resetHi(){nd.select('circle').attr('fill-opacity',0.1).attr('stroke-opacity',0.6).attr('stroke-width',d=>SZ[d.type]>18?1.5:0.8);nd.selectAll('text').attr('fill-opacity',1);lk.attr('stroke-opacity',0.1).attr('stroke-width',0.6);ll.attr('display',showLbl?'block':'none')}

function openP(d){const col=CC[d.type]||'#666';const rels=[];L.forEach(x=>{const s=typeof x.source==='string'?x.source:x.source.id;const t=typeof x.target==='string'?x.target:x.target.id;if(s===d.id){const tn=N.find(n=>n.id===t);rels.push({dir:'→',verb:x.label,target:tn?tn.label:t,tid:t})}if(t===d.id){const sn=N.find(n=>n.id===s);rels.push({dir:'←',verb:x.label,target:sn?sn.label:s,tid:s})}});
let h=`<div class="ph"><div class="pt" style="color:${col}"><span class="d" style="background:${col}"></span>${d.type.replace(/_/g,' ').toUpperCase()}</div><div class="pn">${d.label}</div></div>`;
if(d.props&&Object.keys(d.props).length){h+=`<div class="ps"><div class="pst">Properties</div>`;Object.entries(d.props).forEach(([k,v])=>{const hl=k==='annual_value'||k==='conservative'||k==='deal'||k==='payback'||k==='lighthouse';h+=`<div class="pr"><span class="pk">${k}</span><span class="pv${hl?' hl':''}">${v}</span></div>`});h+=`</div>`}
if(rels.length){h+=`<div class="ps"><div class="pst">Relationships (${rels.length})</div>`;rels.forEach(r=>{h+=`<div class="ri" onclick="window._go('${r.tid}')"><span class="ra">${r.dir}</span><span class="rv">${r.verb}</span><span class="rt">${r.target}</span></div>`});h+=`</div>`}
document.getElementById('pc').innerHTML=h;document.getElementById('panel').classList.add('open')}

window._go=function(id){const n2=N.find(x=>x.id===id);if(n2){hiNode(id);openP(n2);highlightSidebar(id);const sn=sim.nodes().find(x=>x.id===id);if(sn){const t=d3.zoomTransform(svg.node());svg.transition().duration(500).call(zm.transform,d3.zoomIdentity.translate(W/2-sn.x*1.5,H/2-sn.y*1.5).scale(1.5))}}};

function renderSB(filter=''){
  const sb=document.getElementById('sidebar');
  let h=`<div class="sb-search"><span class="sb-si">🔍</span><input type="text" id="sbi" placeholder="Search ${N.length} nodes..." value="${filter}"/></div>`;
  sidebarGroups.forEach(g=>{
    const items=N.filter(n=>n.type===g.type&&(!filter||n.label.toLowerCase().includes(filter.toLowerCase())));
    if(!items.length)return;
    h+=`<div class="sb-g"><div class="sb-gt"><div class="d" style="background:${g.color}"></div>${g.label}<span class="cnt">${items.length}</span></div>`;
    items.forEach(i=>{h+=`<div class="sb-i" data-id="${i.id}"><span class="ic">${g.icon}</span>${i.label}</div>`});
    h+=`</div>`;
  });
  sb.innerHTML=h;
  sb.querySelectorAll('.sb-i').forEach(el=>{el.addEventListener('click',()=>{
    document.querySelectorAll('.sb-i').forEach(x=>x.classList.remove('on'));el.classList.add('on');
    const id=el.dataset.id,node=N.find(x=>x.id===id);
    if(node){hiNode(id);openP(node);const sn=sim.nodes().find(x=>x.id===id);if(sn){svg.transition().duration(500).call(zm.transform,d3.zoomIdentity.translate(W/2-sn.x*1.5,H/2-sn.y*1.5).scale(1.5))}}
  })});
  const inp=document.getElementById('sbi');if(inp){inp.addEventListener('input',function(){renderSB(this.value)});if(filter)inp.focus()}
}

function highlightSidebar(id){document.querySelectorAll('.sb-i').forEach(x=>{x.classList.toggle('on',x.dataset.id===id)})}
