<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex Knowledge Graph — Live Data</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root { --dark:#001C3D;--blue:#1A5AFF;--purple:#93B5FF;--green:#2ECC71;--amber:#D97706;--red:#E02020;--cyan:#93B5FF;--bg:#0B1120; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:#E2E8F0;overflow:hidden;height:100vh}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(11,17,32,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);padding:10px 24px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:0.95rem;font-weight:900;white-space:nowrap}
.topbar h1 span{color:var(--cyan)}
.legend{display:flex;gap:10px;flex:1;justify-content:center}
.legend-item{display:flex;align-items:center;gap:4px;font-size:0.65rem;color:#64748B;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all 0.2s}
.legend-item:hover,.legend-item.active{background:rgba(255,255,255,0.05);color:#CBD5E1}
.legend-dot{width:8px;height:8px;border-radius:3px}
.controls{display:flex;gap:6px}
.ctrl-btn{padding:5px 10px;font-size:0.68rem;font-weight:600;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#94A3B8;border-radius:6px;cursor:pointer;transition:all 0.2s}
.ctrl-btn:hover{background:rgba(255,255,255,0.08);color:#E2E8F0}
.ctrl-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.eng-select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#E2E8F0;padding:5px 10px;border-radius:6px;font-size:0.72rem;font-family:'Libre Franklin',sans-serif;cursor:pointer}
.eng-select option{background:#001C3D}

#graph{width:100%;height:100vh}

.panel{position:fixed;right:-460px;top:0;bottom:0;width:440px;background:rgba(15,21,35,0.97);backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,0.06);z-index:200;transition:right 0.35s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;padding-top:52px}
.panel.open{right:0}
.panel-close{position:absolute;top:62px;right:14px;width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#64748B;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:10}
.panel-close:hover{background:rgba(255,255,255,0.08);color:#E2E8F0}
.panel-header{padding:16px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.panel-type{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.panel-type .dot{width:8px;height:8px;border-radius:3px;display:inline-block}
.panel-name{font-size:1.2rem;font-weight:900;color:#fff;margin-top:2px}
.panel-desc{font-size:0.76rem;color:#64748B;margin-top:4px;line-height:1.5}
.panel-section{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.04)}
.panel-section-title{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#475569;margin-bottom:8px}
.prop-row{display:flex;gap:8px;padding:3px 0;font-size:0.74rem}
.prop-k{font-weight:600;color:#94A3B8;min-width:120px;font-size:0.7rem}
.prop-v{color:#CBD5E1;font-size:0.72rem;word-break:break-word}
.prop-v.highlight{color:var(--cyan);font-weight:600}
.prop-v.score{font-weight:900;font-size:0.85rem}
.rel-item{padding:5px 0;font-size:0.74rem;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:4px;padding:4px 6px;margin:0 -6px}
.rel-item:hover{background:rgba(255,255,255,0.04)}
.rel-arrow{color:#475569;font-size:0.65rem;width:14px;text-align:center}
.rel-verb{color:var(--blue);font-weight:500;font-style:italic;font-size:0.68rem}
.rel-target{color:#CBD5E1;font-weight:600}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:0.62rem;font-weight:600;margin:1px}
.tag-red{background:rgba(255,114,98,0.15);color:var(--red)}
.tag-amber{background:rgba(255,172,9,0.15);color:var(--amber)}
.tag-green{background:rgba(38,188,113,0.15);color:var(--green)}
.tag-blue{background:rgba(26,90,255,0.15);color:var(--blue)}
.tag-purple{background:rgba(26,90,255,0.15);color:var(--purple)}
.tag-gray{background:rgba(148,163,184,0.1);color:#94A3B8}
.timeline-item{padding:6px 0;border-left:2px solid rgba(255,255,255,0.06);padding-left:12px;margin-left:4px;font-size:0.72rem}
.timeline-item .t-date{color:#475569;font-size:0.62rem}
.timeline-item .t-title{color:#CBD5E1;font-weight:600;margin-top:1px}
.timeline-item .t-desc{color:#64748B;font-size:0.68rem;margin-top:2px}
.timeline-item.positive{border-left-color:var(--green)}
.timeline-item.negative{border-left-color:var(--red)}
.timeline-item.neutral{border-left-color:var(--amber)}

.tooltip{position:fixed;padding:8px 12px;background:rgba(15,21,35,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:0.7rem;color:#CBD5E1;pointer-events:none;z-index:300;max-width:280px;display:none;backdrop-filter:blur(8px)}
.tooltip .tt-type{font-size:0.56rem;color:#64748B;text-transform:uppercase;letter-spacing:0.05em}
.tooltip .tt-name{font-weight:700;color:#fff;margin-top:1px}
.tooltip .tt-detail{margin-top:3px;font-size:0.66rem;color:#94A3B8}

.statsbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:16px;background:rgba(15,21,35,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:7px 18px;z-index:100}
.stat{text-align:center}
.stat-val{font-size:1rem;font-weight:900;color:var(--cyan)}
.stat-label{font-size:0.55rem;color:#475569;text-transform:uppercase;letter-spacing:0.06em}
</style>
</head>
<body>

<div class="topbar">
  <h1>Cortex <span>Live Graph</span></h1>
  <select class="eng-select" id="eng-select">
    <option value="all">All Engagements</option>
    <option value="clienta" selected>Client B — Wealth Assessment</option>
    <option value="schoolsfirst">SchoolsFirst — CLO Engagement</option>

    <div class="legend-item" data-cat="client"><div class="legend-dot" style="background:var(--blue)"></div>Client</div>
    <div class="legend-item" data-cat="engagement"><div class="legend-dot" style="background:var(--cyan)"></div>Engagement</div>
    <div class="legend-item" data-cat="workshop"><div class="legend-dot" style="background:var(--amber)"></div>Workshop</div>
    <div class="legend-item" data-cat="discovery"><div class="legend-dot" style="background:var(--red)"></div>Discovery</div>
    <div class="legend-item" data-cat="capability"><div class="legend-dot" style="background:var(--green)"></div>Capability</div>
    <div class="legend-item" data-cat="usecase"><div class="legend-dot" style="background:var(--purple)"></div>UseCase</div>
    <div class="legend-item" data-cat="financial"><div class="legend-dot" style="background:#D97706"></div>Financial</div>
    <div class="legend-item" data-cat="outcome"><div class="legend-dot" style="background:#EC4899"></div>Outcome</div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-labels">Labels</button>
    <button class="ctrl-btn" id="btn-reset">Reset</button>
  </div>
</div>

<svg id="graph"></svg>
<div class="panel" id="panel"><button class="panel-close" id="panel-close">&times;</button><div id="panel-content"></div></div>
<div class="tooltip" id="tooltip"></div>

    // Discovery → Capability (reveals gap)
    {source:'d1',target:'cap1',label:'revealsGap',type:'capability'},
    {source:'d2',target:'cap2',label:'revealsGap',type:'capability'},
    {source:'d3',target:'cap3',label:'revealsGap',type:'capability'},
    {source:'d4',target:'cap4',label:'revealsGap',type:'capability'},

    // UseCase → Discovery (addresses)
    {source:'uc1',target:'d1',label:'addresses',type:'usecase'},
    {source:'uc2',target:'d3',label:'addresses',type:'usecase'},
    {source:'uc3',target:'d2',label:'addresses',type:'usecase'},
    {source:'uc4',target:'d5',label:'addresses',type:'usecase'},

    // UseCase → Capability (closes gap)
    {source:'uc1',target:'cap1',label:'closesGap',type:'usecase'},
    {source:'uc2',target:'cap3',label:'closesGap',type:'usecase'},
    {source:'uc3',target:'cap2',label:'closesGap',type:'usecase'},
    {source:'uc3',target:'cap4',label:'closesGap',type:'usecase'},

    // UseCase → ValueLever (drives)
    {source:'uc1',target:'vl1',label:'drives',type:'financial'},
    {source:'uc2',target:'vl2',label:'drives',type:'financial'},
    {source:'uc3',target:'vl3',label:'drives',type:'financial'},
    {source:'uc4',target:'vl4',label:'drives',type:'financial'},

    // ValueLever → ROI
    {source:'vl1',target:'roi',label:'contributesTo',type:'financial'},
    {source:'vl2',target:'roi',label:'contributesTo',type:'financial'},
    {source:'vl3',target:'roi',label:'contributesTo',type:'financial'},
    {source:'vl4',target:'roi',label:'contributesTo',type:'financial'},

    // UseCase → Roadmap
    {source:'uc1',target:'rm_p1',label:'scheduledIn',type:'roadmap'},
    {source:'uc2',target:'rm_p1',label:'scheduledIn',type:'roadmap'},
    {source:'uc3',target:'rm_p2',label:'scheduledIn',type:'roadmap'},
    {source:'uc4',target:'rm_p2',label:'scheduledIn',type:'roadmap'},

    // Discovery → Pain Pattern
    {source:'d1',target:'pp1',label:'isInstanceOf',type:'pattern'},
    {source:'d3',target:'pp2',label:'isInstanceOf',type:'pattern'},

    // Decisions
    {source:'d7',target:'dec1',label:'influenced',type:'decision'},
    {source:'d6',target:'dec2',label:'influenced',type:'decision'},
    {source:'roi',target:'dec3',label:'justified',type:'decision'},

    // Outcome
    {source:'dec3',target:'out1',label:'ledTo',type:'outcome'},
    {source:'nfis_assess',target:'out1',label:'hasOutcome',type:'outcome'},
  ]
}
};

// ─── RENDER ────────────────────────────────────
const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').attr('width', width).attr('height', height);
const defs = svg.append('defs');

// Arrow markers per type
Object.entries(CAT_COLORS).forEach(([k,c]) => {
  defs.append('marker').attr('id',`arr-${k}`).attr('viewBox','0 -5 10 10').attr('refX',24).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
    .append('path').attr('d','M0,-4L10,0L0,4').attr('fill',c).attr('opacity',0.6);
});

// Glow filters
Object.entries(CAT_COLORS).forEach(([k,c]) => {
  const f = defs.append('filter').attr('id',`glow-${k}`);
  f.append('feGaussianBlur').attr('stdDeviation',4).attr('result','blur');
  f.append('feComposite').attr('in','SourceGraphic').attr('in2','blur').attr('operator','over');
});

const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.15,5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

let currentData = engagements.clienta;
let simulation, linkSel, linkLabelSel, nodeSel;
let showLabels = false;

function render(data) {
  g.selectAll('*').remove();
  currentData = data;

  // Stats
  document.getElementById('statsbar').innerHTML = `
    <div class="stat"><div class="stat-val">${data.nodes.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-val">${data.links.length}</div><div class="stat-label">Relationships</div></div>
    <div class="stat"><div class="stat-val">${data.nodes.filter(n=>n.type==='workshop').length}</div><div class="stat-label">Workshops</div></div>
    <div class="stat"><div class="stat-val">${data.nodes.filter(n=>n.type==='discovery').length}</div><div class="stat-label">Discoveries</div></div>
    <div class="stat"><div class="stat-val">${data.nodes.filter(n=>n.type==='usecase').length}</div><div class="stat-label">Use Cases</div></div>
  `;

  const nodesCopy = data.nodes.map(d => ({...d}));
  const linksCopy = data.links.map(d => ({...d}));

  simulation = d3.forceSimulation(nodesCopy)
    .force('link', d3.forceLink(linksCopy).id(d=>d.id).distance(d => {
      if(d.type==='core') return 100;
      if(d.type==='workshop') return 90;
      return 120;
    }).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-500))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide(32));

  linkSel = g.append('g').selectAll('line').data(linksCopy).join('line')
    .attr('stroke', d => CAT_COLORS[d.type] || '#334')
    .attr('stroke-width', d => d.type==='core' ? 2 : 1.2)
    .attr('stroke-opacity', d => d.type==='core' ? 0.4 : 0.2)
    .attr('marker-end', d => `url(#arr-${d.type})`);

  linkLabelSel = g.append('g').selectAll('text').data(linksCopy).join('text')
    .text(d=>d.label).attr('text-anchor','middle').attr('fill','#475569').attr('font-size','7px')
    .attr('font-family',"'Libre Franklin',sans-serif").attr('font-weight',500).attr('display','none');

  nodeSel = g.append('g').selectAll('g').data(nodesCopy).join('g')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null})
    );

  // Size by importance
  const sizeMap = {client:28,engagement:32,workshop:18,discovery:14,capability:14,usecase:16,financial:14,outcome:20,decision:13,roadmap:14,pattern:18,consultant:16};

  nodeSel.append('circle')
    .attr('r', d => sizeMap[d.type] || sizeMap[d.cat] || 14)
    .attr('fill', d => CAT_COLORS[d.cat] || CAT_COLORS[d.type] || '#444')
    .attr('fill-opacity', 0.15)
    .attr('stroke', d => CAT_COLORS[d.cat] || CAT_COLORS[d.type] || '#444')
    .attr('stroke-width', d => d.type==='engagement'||d.type==='client' ? 2.5 : 1.5)
    .attr('stroke-opacity', 0.8)
    .style('cursor','pointer')
    .style('filter', d => `url(#glow-${d.cat || d.type})`);

  // Node labels
  nodeSel.append('text')
    .text(d => d.label.length > 22 ? d.label.slice(0,20)+'…' : d.label)
    .attr('text-anchor','middle')
    .attr('dy', d => (sizeMap[d.type] || sizeMap[d.cat] || 14) + 12)
    .attr('fill', d => CAT_COLORS[d.cat] || CAT_COLORS[d.type] || '#666')
    .attr('font-size','8px').attr('font-weight',600)
    .attr('font-family',"'Libre Franklin',sans-serif")
    .style('pointer-events','none');

  // Type icon inside node
  const iconMap = {client:'🏦',engagement:'📋',workshop:'🎯',discovery:'🔍',capability:'📊',usecase:'💡',financial:'💰',outcome:'🎉',decision:'⚖️',roadmap:'🛣️',pattern:'🔄',consultant:'👤',value_lever:'📈',roi_model:'💵',roadmap_phase:'📅'};
  nodeSel.append('text')
    .text(d => iconMap[d.type] || '●')
    .attr('text-anchor','middle').attr('dy','4px')
    .attr('font-size', d => (sizeMap[d.type]||14) > 18 ? '14px' : '10px')
    .style('pointer-events','none');

  // Interactions
  const tooltip = document.getElementById('tooltip');
  nodeSel.on('mouseover',(e,d)=>{
    tooltip.innerHTML=`<div class="tt-type">${d.type}</div><div class="tt-name">${d.label}</div>`;
    const firstProp = Object.entries(d.props||{})[0];
    if(firstProp) tooltip.innerHTML+=`<div class="tt-detail">${firstProp[0]}: ${firstProp[1]}</div>`;
    tooltip.style.display='block';tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-8)+'px';
  }).on('mousemove',e=>{tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-8)+'px'})
  .on('mouseout',()=>tooltip.style.display='none')
  .on('click',(e,d)=>{e.stopPropagation();highlightNode(d.id,nodesCopy,linksCopy);openPanel(d,linksCopy,nodesCopy)});

  svg.on('click',()=>{resetHighlight(linksCopy);document.getElementById('panel').classList.remove('open')});

  simulation.on('tick',()=>{
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    linkLabelSel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);
    nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

  // Fit after settle
  setTimeout(()=>{
    const bounds = g.node().getBBox();
    const dx=bounds.width,dy=bounds.height,x=bounds.x+dx/2,y=bounds.y+dy/2;
    const scale=0.8/Math.max(dx/width,dy/height);
    svg.transition().duration(800).call(zoom.transform,d3.zoomIdentity.translate(width/2-scale*x,height/2-scale*y).scale(scale));
  },2000);
}

function highlightNode(id,nodes,links){
  const connected=new Set([id]);
  links.forEach(l=>{
    const s=typeof l.source==='string'?l.source:l.source.id;
    const t=typeof l.target==='string'?l.target:l.target.id;
    if(s===id)connected.add(t);if(t===id)connected.add(s);
  });
  nodeSel.select('circle').attr('fill-opacity',d=>connected.has(d.id)?0.3:0.03).attr('stroke-opacity',d=>connected.has(d.id)?1:0.08).attr('stroke-width',d=>d.id===id?3:connected.has(d.id)?2:1);
  nodeSel.selectAll('text').attr('fill-opacity',d=>connected.has(d.id)?1:0.1);
  linkSel.attr('stroke-opacity',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?0.7:0.02}).attr('stroke-width',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?2.5:1});
  linkLabelSel.attr('display',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?'block':'none'}).attr('fill','#94A3B8').attr('font-size','9px');
}

function resetHighlight(links){
  nodeSel.select('circle').attr('fill-opacity',0.15).attr('stroke-opacity',0.8).attr('stroke-width',d=>d.type==='engagement'||d.type==='client'?2.5:1.5);
  nodeSel.selectAll('text').attr('fill-opacity',1);
  linkSel.attr('stroke-opacity',d=>d.type==='core'?0.4:0.2).attr('stroke-width',d=>d.type==='core'?2:1.2);
  linkLabelSel.attr('display',showLabels?'block':'none');
}

function openPanel(d,links,nodes){
  const color=CAT_COLORS[d.cat]||CAT_COLORS[d.type]||'#666';
  const rels=[];
  links.forEach(l=>{
    const s=typeof l.source==='string'?l.source:l.source.id;
    const t=typeof l.target==='string'?l.target:l.target.id;
    if(s===d.id){const tn=nodes.find(n=>n.id===t);rels.push({dir:'→',verb:l.label,target:tn?tn.label:t,targetId:t})}
    if(t===d.id){const sn=nodes.find(n=>n.id===s);rels.push({dir:'←',verb:l.label,target:sn?sn.label:s,targetId:s})}
  });

  // Score coloring
  function scoreColor(v){const n=parseFloat(v);if(isNaN(n))return'';if(n<=1)return'color:var(--red)';if(n<=2)return'color:var(--amber)';if(n<=3)return'color:var(--green)';return'color:var(--blue)'}

  let html=`<div class="panel-header">
    <div class="panel-type" style="color:${color}"><span class="dot" style="background:${color}"></span>${d.type.replace(/_/g,' ').toUpperCase()}</div>
    <div class="panel-name">${d.label}</div>
  </div>`;

  // Properties
  if(d.props && Object.keys(d.props).length){
    html+=`<div class="panel-section"><div class="panel-section-title">Properties</div>`;
    Object.entries(d.props).forEach(([k,v])=>{
      const isScore=k==='current'||k==='target'||k==='gap';
      const isHighlight=k==='annual_value'||k==='conservative_npv'||k==='deal_value'||k==='priority_score';
      let valClass='prop-v';
      if(isScore)valClass+=' score';
      if(isHighlight)valClass+=' highlight';
      let style='';
      if(isScore)style=scoreColor(v);
      html+=`<div class="prop-row"><span class="prop-k">${k.replace(/_/g,' ')}</span><span class="${valClass}" style="${style}">${v}</span></div>`;
    });
    html+=`</div>`;
  }

  // Relationships
  if(rels.length){
    html+=`<div class="panel-section"><div class="panel-section-title">Relationships (${rels.length})</div>`;
    rels.forEach(r=>{
      html+=`<div class="rel-item" onclick="window._navTo('${r.targetId}')">
        <span class="rel-arrow">${r.dir}</span>
        <span class="rel-verb">${r.verb}</span>
        <span class="rel-target">${r.target}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('panel-content').innerHTML=html;
  document.getElementById('panel').classList.add('open');
}

window._navTo=function(id){
  const n=currentData.nodes.find(nd=>nd.id===id);
  if(!n)return;
  // Find in simulation
  const simNode=simulation.nodes().find(sn=>sn.id===id);
  if(simNode){
    highlightNode(id,simulation.nodes(),currentData.links);
    openPanel({...n,...simNode},currentData.links,simulation.nodes());
    const t=d3.zoomTransform(svg.node());
    svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(width/2-simNode.x*t.k,height/2-simNode.y*t.k).scale(t.k));
  }
};

// Controls
document.getElementById('panel-close').addEventListener('click',()=>{document.getElementById('panel').classList.remove('open');resetHighlight(currentData.links)});
document.getElementById('btn-labels').addEventListener('click',function(){showLabels=!showLabels;this.classList.toggle('active');linkLabelSel.attr('display',showLabels?'block':'none')});
document.getElementById('btn-reset').addEventListener('click',()=>{svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);resetHighlight(currentData.links);document.getElementById('panel').classList.remove('open')});

// Legend filter
document.querySelectorAll('.legend-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const cat=item.dataset.cat;
    document.querySelectorAll('.legend-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    if(cat==='all'){resetHighlight(currentData.links)}
    else{
      nodeSel.select('circle').attr('fill-opacity',d=>(d.cat===cat||d.type===cat)?0.3:0.03).attr('stroke-opacity',d=>(d.cat===cat||d.type===cat)?1:0.08);
      nodeSel.selectAll('text').attr('fill-opacity',d=>(d.cat===cat||d.type===cat)?1:0.1);
      linkSel.attr('stroke-opacity',d=>{
        const s=simulation.nodes().find(n=>n.id===(typeof d.source==='string'?d.source:d.source.id));
        const t=simulation.nodes().find(n=>n.id===(typeof d.target==='string'?d.target:d.target.id));
        return(s&&(s.cat===cat||s.type===cat))||(t&&(t.cat===cat||t.type===cat))?0.5:0.02;
      });
    }
  });
});

// Engagement selector
document.getElementById('eng-select').addEventListener('change',function(){
  const val=this.value;
  if(engagements[val]) render(engagements[val]);
});

// Initial render
render(engagements.clienta);
</script>
</body>
</html>
