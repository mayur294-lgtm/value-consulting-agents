const W=window.innerWidth-240,H=window.innerHeight;
const svg=d3.select('#graph').attr('width',W).attr('height',H);
const defs=svg.append('defs');
Object.entries(CC).forEach(([k,c])=>{
  defs.append('marker').attr('id',`a-${k}`).attr('viewBox','0 -5 10 10').attr('refX',26).attr('refY',0).attr('markerWidth',4).attr('markerHeight',4).attr('orient','auto').append('path').attr('d','M0,-4L10,0L0,4').attr('fill',c).attr('opacity',0.5);
  const f=defs.append('filter').attr('id',`g-${k}`);f.append('feGaussianBlur').attr('stdDeviation',3).attr('result','b');f.append('feComposite').attr('in','SourceGraphic').attr('in2','b').attr('operator','over');
});

  .force('charge',d3.forceManyBody().strength(-300))
  .force('center',d3.forceCenter(W/2,H/2))
  .force('collision',d3.forceCollide(d=>(SZ[d.type]||12)+4));

const lk=gg.append('g').selectAll('line').data(L).join('line')
  .attr('stroke',d=>CC[d.type]||'#222').attr('stroke-width',d=>d.type==='client'||d.type==='consultant'?1.5:0.8).attr('stroke-opacity',d=>d.type==='pattern'?0.35:d.type==='client'?0.3:0.12)
  .attr('marker-end',d=>`url(#a-${d.type})`);

const ll=gg.append('g').selectAll('text').data(L).join('text').text(d=>d.label).attr('text-anchor','middle').attr('fill','#3D4555').attr('font-size','6px').attr('font-family',"'Libre Franklin'").attr('font-weight',500).attr('display','none');

let showLbl=false;
const nd=gg.append('g').selectAll('g').data(N).join('g')
  .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

nd.append('circle').attr('r',d=>SZ[d.type]||12).attr('fill',d=>CC[d.cat]||CC[d.type]||'#333').attr('fill-opacity',0.12).attr('stroke',d=>CC[d.cat]||CC[d.type]||'#333').attr('stroke-width',d=>d.type==='client'||d.type==='pattern'?2:1.2).attr('stroke-opacity',0.7).style('cursor','pointer').style('filter',d=>`url(#g-${d.cat||d.type})`);

function hiNode(id){
  const c=new Set([id]);L.forEach(x=>{const s=typeof x.source==='string'?x.source:x.source.id;const t=typeof x.target==='string'?x.target:x.target.id;if(s===id)c.add(t);if(t===id)c.add(s)});
  nd.select('circle').attr('fill-opacity',d=>c.has(d.id)?0.25:0.02).attr('stroke-opacity',d=>c.has(d.id)?1:0.05).attr('stroke-width',d=>d.id===id?3:c.has(d.id)?2:1);
  nd.selectAll('text').attr('fill-opacity',d=>c.has(d.id)?1:0.08);
  lk.attr('stroke-opacity',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?0.6:0.015}).attr('stroke-width',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?2.5:0.8});
  ll.attr('display',d=>{const s=typeof d.source==='string'?d.source:d.source.id;const t=typeof d.target==='string'?d.target:d.target.id;return(s===id||t===id)?'block':'none'}).attr('fill','#94A3B8').attr('font-size','8px');
}
function resetHi(){
  nd.select('circle').attr('fill-opacity',0.12).attr('stroke-opacity',0.7).attr('stroke-width',d=>d.type==='client'||d.type==='pattern'?2:1.2);
  nd.selectAll('text').attr('fill-opacity',1);
  lk.attr('stroke-opacity',d=>d.type==='pattern'?0.35:d.type==='client'?0.3:0.12).attr('stroke-width',d=>d.type==='client'||d.type==='consultant'?1.5:0.8);
  ll.attr('display',showLbl?'block':'none');
}

function openP(d){
  const col=CC[d.cat]||CC[d.type]||'#666';
  const rels=[];L.forEach(x=>{const s=typeof x.source==='string'?x.source:x.source.id;const t=typeof x.target==='string'?x.target:x.target.id;if(s===d.id){const tn=N.find(n=>n.id===t);rels.push({dir:'→',verb:x.label,target:tn?tn.label:t,tid:t})}if(t===d.id){const sn=N.find(n=>n.id===s);rels.push({dir:'←',verb:x.label,target:sn?sn.label:s,tid:s})}});
  let h=`<div class="ph"><div class="pt" style="color:${col}"><span class="d" style="background:${col}"></span>${d.type.toUpperCase()}</div><div class="pn">${d.label}</div></div>`;
  if(d.props&&Object.keys(d.props).length){h+=`<div class="ps"><div class="pst">Properties</div>`;Object.entries(d.props).forEach(([k,v])=>{h+=`<div class="pr"><span class="pk">${k}</span><span class="pv">${v}</span></div>`});h+=`</div>`}
  if(rels.length){h+=`<div class="ps"><div class="pst">Relationships (${rels.length})</div>`;rels.forEach(r=>{h+=`<div class="ri" onclick="window._go('${r.tid}')"><span class="ra">${r.dir}</span><span class="rv">${r.verb}</span><span class="rt">${r.target}</span></div>`});h+=`</div>`}
  document.getElementById('pc').innerHTML=h;document.getElementById('panel').classList.add('open');
}
window._go=function(id){const nd2=N.find(x=>x.id===id);if(nd2){hiNode(id);openP(nd2);const sn=sim.nodes().find(x=>x.id===id);if(sn){const t=d3.zoomTransform(svg.node());svg.transition().duration(500).call(zm.transform,d3.zoomIdentity.translate(W/2-sn.x*t.k,H/2-sn.y*t.k).scale(t.k))}}};

document.getElementById('pcl').addEventListener('click',()=>{document.getElementById('panel').classList.remove('open');resetHi()});
document.getElementById('btn-labels').addEventListener('click',function(){showLbl=!showLbl;this.classList.toggle('on');ll.attr('display',showLbl?'block':'none')});
document.getElementById('btn-reset').addEventListener('click',()=>{svg.transition().duration(500).call(zm.transform,d3.zoomIdentity);resetHi();document.getElementById('panel').classList.remove('open')});

document.querySelectorAll('.leg').forEach(item=>{item.addEventListener('click',()=>{
  const c=item.dataset.c;document.querySelectorAll('.leg').forEach(i=>i.classList.remove('on'));item.classList.add('on');
  if(c==='all'){resetHi()}else{
    nd.select('circle').attr('fill-opacity',d=>(d.cat===c||d.type===c)?0.25:0.02).attr('stroke-opacity',d=>(d.cat===c||d.type===c)?1:0.05);
    nd.selectAll('text').attr('fill-opacity',d=>(d.cat===c||d.type===c)?1:0.06);
    lk.attr('stroke-opacity',d=>{const s=N.find(n=>n.id===(typeof d.source==='string'?d.source:d.source.id));const t=N.find(n=>n.id===(typeof d.target==='string'?d.target:d.target.id));return(s&&(s.cat===c||s.type===c))||(t&&(t.cat===c||t.type===c))?0.4:0.015});
  }
})});

sim.on('tick',()=>{lk.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);ll.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);nd.attr('transform',d=>`translate(${d.x},${d.y})`)});

const groups = [
  {cat:'client',label:'Clients',icon:'🏦',color:'#1A5AFF'},
  {cat:'consultant',label:'Consultants',icon:'👤',color:'#06B6D4'},
  {cat:'engagement',label:'Engagements',icon:'📋',color:'#93B5FF'},
  {cat:'workshop',label:'Workshops',icon:'🎯',color:'#D97706'},
  {cat:'discovery',label:'Discoveries',icon:'🔍',color:'#E02020'},
  {cat:'pattern',label:'Pain Patterns',icon:'🔄',color:'#D946EF'},
  {cat:'usecase',label:'Use Cases',icon:'💡',color:'#93B5FF'},
  {cat:'outcome',label:'Outcomes',icon:'🎉',color:'#EC4899'},
  {cat:'benchmark',label:'Benchmarks',icon:'📏',color:'#0891B2'},
];

function renderSidebar(filter=''){
  const sb=document.getElementById('sidebar');
  let html=`<div class="sb-search"><span class="sb-search-icon">&#x1F50D;</span><input type="text" id="sb-input" placeholder="Search nodes..." value="${filter}" /></div>`;
  groups.forEach(g=>{
    const items=N.filter(n=>(n.type===g.cat||n.cat===g.cat)&&(!filter||n.label.toLowerCase().includes(filter.toLowerCase())));
    if(items.length===0) return;
    html+=`<div class="sb-group"><div class="sb-group-title"><div class="ld" style="background:${g.color}"></div>${g.label} (${items.length})</div>`;
    items.forEach(item=>{
      html+=`<div class="sb-item" data-id="${item.id}"><span class="sb-icon">${g.icon}</span>${item.label}</div>`;
    });
    html+=`</div>`;
  });
  sb.innerHTML=html;

  // Wire up clicks
  sb.querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.id;
      sb.querySelectorAll('.sb-item').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const node=N.find(x=>x.id===id);
      if(node){
        hiNode(id);
        openP(node);
        // Pan to node
        const sn=sim.nodes().find(x=>x.id===id);
        if(sn){
          const t=d3.zoomTransform(svg.node());
          const gW=W-240; // account for sidebar
          svg.transition().duration(600).call(zm.transform,d3.zoomIdentity.translate(gW/2-sn.x*1.2,H/2-sn.y*1.2).scale(1.2));
        }
      }
    });
  });

  // Wire up search
  const input=document.getElementById('sb-input');
  if(input){
    input.addEventListener('input',function(){renderSidebar(this.value)});
    if(filter) input.focus();
  }
}
